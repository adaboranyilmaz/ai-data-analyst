[project]
name = "ai-data-analyst"
version = "0.1.0"
description = "An AI data analyst whose answers carry their evidence and a calibrated confidence, and whose confidence is measured against whether it is right."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
# The project dependencies are what the served API needs; the pipeline's tools are the
# `pipeline` group, which `uv sync` installs by default along with `dev`.
dependencies = [
    "anthropic>=1.8.0",
    "jsonschema>=4.26",
    "opentelemetry-sdk>=1.45",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
    "sqlglot>=30.20",
]

[dependency-groups]
pipeline = [
    "python-dotenv>=1.0",
    "mlflow>=3.0",
    "dvc>=3.55",
    "ollama>=0.6",
    "numpy>=2.0",
]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "pre-commit>=3.8",
]
# BIRD's official evaluator and the exact versions its requirements pin, used only to check
# that the project's scoring reproduces its verdicts: `uv run --group bird-eval ...`.
bird-eval = [
    "func-timeout==4.3.5",
    "psycopg2-binary==2.9.9",
    "pymysql==1.1.1",
]

[tool.uv]
default-groups = ["pipeline", "dev"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "db: needs the compose PostgreSQL (`docker compose up -d --wait`); skipped when it is not running, unless ANALYST_REQUIRE_DB=1",
    "bird: needs the BIRD benchmark loaded and its files in data/raw; skipped without them, unless ANALYST_REQUIRE_BIRD=1",
]
