# Prometheus for the analyst service: scrape its /metrics and evaluate the alert rules.
#   docker compose --profile monitoring up -d --wait   (Prometheus on 9090, Grafana on 3001)
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: analyst-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
