          - \b(lead|leads|led) to\b
          - \b(effect|impact|influence) (of|on)\b
          - \bprotect(s|ed)?\b
          - \bdue to\b
          - \b(associated|correlated|related) (with|to)\b
          - \b(relationship|association|correlation) between\b
          - \bdepend(s)? on\b
          - \b(become|became|get|got) (more|less)\b
          - \bover time\b
          - \btrend\b
          - \bchange(d|s)? (with|over)\b
          - ^(do|does|did|are|is|were|was|have|has) 
            \b.*\b(more|less|fewer|larger|smaller|higher|lower|better|worse)\b
        phase: phase7
        planted.templates:
        - id: A1
          family: rates
          exposure: has_card
          question: Do loans on accounts with a credit card go bad more often 
            than loans on accounts without one?
          reference:
            sql: SELECT EXISTS (SELECT 1 FROM disp AS d JOIN card AS c ON 
              c.disp_id = d.disp_id WHERE d.account_id = l.account_id) AS 
              has_card, CASE WHEN l.status IN ('B', 'D') THEN 1 ELSE 0 END AS 
              bad FROM loan AS l
            analysis: compare_groups
            outcome: bad
            outcome_type: binary
            group: has_card
            reference_group: 'false'
            exposed_group: 'true'
        - id: A2
          family: rates
          exposure: prague
          question: Are loans granted by branches in the Prague region more 
            likely to go bad than loans granted by branches elsewhere?
          reference:
            sql: SELECT di.a3 = 'Prague' AS prague_branch, CASE WHEN l.status IN
              ('B', 'D') THEN 1 ELSE 0 END AS bad FROM loan AS l JOIN account AS
              a ON a.account_id = l.account_id JOIN district AS di ON 
              di.district_id = a.district_id
            analysis: compare_groups
            outcome: bad
            outcome_type: binary
            group: prague_branch
            reference_group: 'false'
            exposed_group: 'true'
        - id: B1
          family: means
          exposure: female
          question: Do women borrow larger amounts than men?
          reference:
            sql: SELECT c.gender, l.amount FROM loan AS l JOIN disp AS d ON 
              d.account_id = l.account_id AND d.type = 'OWNER' JOIN client AS c 
              ON c.client_id = d.client_id
            analysis: compare_groups
            outcome: amount
            outcome_type: numeric
            group: gender
            reference_group: M
            exposed_group: F
        - id: B2
          family: means
          exposure: has_card
          question: Are loans on accounts with a credit card larger than loans 
            on accounts without one?
          reference:
            sql: SELECT EXISTS (SELECT 1 FROM disp AS d JOIN card AS c ON 
              c.disp_id = d.disp_id WHERE d.account_id = l.account_id) AS 
              has_card, l.amount FROM loan AS l
            analysis: compare_groups
            outcome: amount
            outcome_type: numeric
            group: has_card
            reference_group: 'false'
            exposed_group: 'true'
        - id: C1
          family: trend
          exposure: year
          question: Did the share of loans that go bad change with the year the 
            loan was granted?
          reference:
            sql: SELECT EXTRACT(YEAR FROM l.date) AS year, CASE WHEN l.status IN
              ('B', 'D') THEN 1 ELSE 0 END AS bad FROM loan AS l
            analysis: trend
            outcome: bad
            outcome_type: binary
            x: year
        - id: C2
          family: trend
          exposure: age
          question: Are older borrowers more likely to have their loan go bad?
          reference:
            sql: SELECT EXTRACT(YEAR FROM AGE(l.date, c.birth_date)) AS age, 
              CASE WHEN l.status IN ('B', 'D') THEN 1 ELSE 0 END AS bad FROM 
              loan AS l JOIN disp AS d ON d.account_id = l.account_id AND d.type
              = 'OWNER' JOIN client AS c ON c.client_id = d.client_id
            analysis: trend
            outcome: bad
            outcome_type: binary
            x: age
        - id: D1
          family: confounded
          exposure: weekly
          confounder: long_loan
          plant:
            p_low: 0.12
            p_high: 0.47
            q_low: 0.05
            q_high: 0.6
            delta_reversed: -0.11
          question: Are loans on accounts with weekly statements more likely to 
            go bad than loans on accounts with monthly statements?
          reference:
            sql: SELECT a.frequency, CASE WHEN l.status IN ('B', 'D') THEN 1 
              ELSE 0 END AS bad, l.duration FROM loan AS l JOIN account AS a ON 
              a.account_id = l.account_id WHERE a.frequency IN ('POPLATEK 
              TYDNE', 'POPLATEK MESICNE')
            analysis: compare_groups
            outcome: bad
            outcome_type: binary
            group: frequency
            reference_group: POPLATEK MESICNE
            exposed_group: POPLATEK TYDNE
            strata:
            - duration
        - id: D2
          family: confounded
          exposure: female
          confounder: amount_rank
          plant:
            p_low: 0.12
            p_high: 0.82
            q_low: 0.05
            q_high: 0.95
            delta_reversed: -0.11
          question: Are loans taken out by women more likely to go bad than 
            loans taken out by men?
          reference:
            sql: SELECT c.gender, CASE WHEN l.status IN ('B', 'D') THEN 1 ELSE 0
              END AS bad, l.amount FROM loan AS l JOIN disp AS d ON d.account_id
              = l.account_id AND d.type = 'OWNER' JOIN client AS c ON 
              c.client_id = d.client_id
            analysis: compare_groups
            outcome: bad
            outcome_type: binary
            group: gender
            reference_group: M
            exposed_group: F
            strata:
            - amount
