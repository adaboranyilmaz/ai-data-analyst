- question_id: 24
  db_id: california_schools
  question: Give the names of the schools with the percent eligible for free meals in K-12 is more than
    0.1 and test takers whose test score is greater than or equal to 1500?
  hint: Percent eligible for free meals = Free Meal Count (K-12) / Total (Enrollment (K-12)
  answer_sql: "SELECT s.school\nFROM schools s\nJOIN satscores sc ON sc.cds = s.cdscode\nJOIN frpm f ON\
    \ f.\"cdscode\" = s.cdscode\nWHERE f.\"Percent (%) Eligible Free (K-12)\" > 0.1\n  AND sc.numge1500\
    \ > 0"
  expert_sql: SELECT T2."School Name" FROM satscores AS T1 INNER JOIN frpm AS T2 ON T1.cds = T2.CDSCode
    WHERE CAST(T2."Free Meal Count (K-12)" AS REAL) / NULLIF(T2."Enrollment (K-12)", 0) > 0.1 AND T1.NumGE1500
    > 0
  outcome: ok
  relation: overlap
  hand_category: filter
  expert_questionable: false
  note: Filters on the stored percent column instead of the hint's ratio (Free Meal Count (K-12) / Enrollment
    (K-12)); the extra join to schools for the name is harmless.
- question_id: 26
