        description: anti-nucleus antibody concentration
        data_format: integer
      ANA Pattern:
        bird_name: ANA Pattern
        name: pattern observed in the sheet of ANA examination
        description: pattern observed in the sheet of ANA examination
        data_format: text
      aCL IgA:
        bird_name: aCL IgA
        name: anti-Cardiolipin antibody (IgA) concentration
        description: anti-Cardiolipin antibody (IgA) concentration
        data_format: integer
      diagnosis:
        bird_name: Diagnosis
        name: Diagnosis
        description: disease names
        data_format: text
      kct:
        bird_name: KCT
        name: measure of degree of coagulation
        description: measure of degree of coagulation
        data_format: text
        value_description: |-
          +: positive

          -: negative
      rvvt:
        bird_name: RVVT
        name: measure of degree of coagulation
        description: measure of degree of coagulation
        data_format: text
        value_description: |-
          +: positive

          -: negative
      lac:
        bird_name: LAC
        name: measure of degree of coagulation
        description: measure of degree of coagulation
        data_format: text
        value_description: |-
          +: positive

          -: negative
      symptoms:
        bird_name: Symptoms
        name: Symptoms
        description: other symptoms observed
        data_format: text
      thrombosis:
        bird_name: Thrombosis
        name: Thrombosis
        description: degree of thrombosis
        data_format: integer
        value_description: |-
          0: negative (no thrombosis)
          1: positive (the most severe one)
          2: positive (severe)3: positive (mild)
