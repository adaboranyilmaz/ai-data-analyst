# Every number in README.md and TECHNICAL_REPORT.md, by name: the results file it comes from
# (a path under results/), the field inside it (`/`-separated; list items by index) and its
# format (`fmt` in scripts/90_readme.py). `expr` is arithmetic over other names;
# `count_where`, `sum_of` and `mean_of` summarise a list; `pending: true` renders TBD until
# the result exists. Edit this file or the templates, never the rendered documents.

values:
  # the benchmark data and its dictionaries
  bird_questions: {file: metrics/data_stats.json, path: gold/questions, fmt: int}
  gold_executed: {file: metrics/data_stats.json, path: gold/executed_ok, fmt: int}
  gold_excluded: {file: metrics/data_stats.json, path: gold/excluded, fmt: int}
  bird_databases: {file: metrics/data_stats.json, path: totals/databases, fmt: int}
  bird_tables: {file: metrics/data_stats.json, path: totals/tables, fmt: int}
  bird_columns: {file: metrics/data_stats.json, path: totals/columns, fmt: int}
  bird_columns_described: {file: metrics/data_stats.json, path: totals/columns_described, fmt: int}
  financial_trans_rows: {file: metrics/data_stats.json, path: financial/row_counts/trans/loaded, fmt: int}
  financial_code_values: {file: metrics/data_stats.json, path: financial/code_values_present, fmt: int}
  financial_code_values_translated: {file: metrics/data_stats.json, path: financial/code_values_translated, fmt: int}

  # the safe execution layer: database hardening, the security suite, the tools
  hardened_functions: {file: metrics/db_hardening.json, path: databases/bird/functions_closed, fmt: int}
  hardened_views: {file: metrics/db_hardening.json, path: databases/bird/views_closed, fmt: int}
  schema_roles: {file: metrics/db_hardening.json, path: databases/bird/schema_roles/roles, fmt: int}
  security_attacks: {file: metrics/security_suite.json, path: attacks, fmt: int}
  security_names_listed: {file: metrics/security_suite.json, path: summary/database/documented_exception, fmt: int}
  security_parser_breach: {file: metrics/security_suite.json, path: summary/parser/breach, fmt: int}
  security_database_breach: {file: metrics/security_suite.json, path: summary/database/breach, fmt: int}
  security_privileges_breach: {file: metrics/security_suite.json, path: summary/privileges/breach, fmt: int}
  security_breaches: {expr: security_parser_breach + security_database_breach + security_privileges_breach, fmt: int}
  security_timeout: {file: metrics/security_suite.json, path: settings/timeout_s, fmt: int}
  guard_gold_accepted: {file: metrics/tool_check.json, path: guard/accepted, fmt: int}
  tools_gold_reproduced: {file: metrics/tool_check.json, path: execution/same_result_as_gold, fmt: int}
  run_sql_p50_ms: {file: metrics/tool_check.json, path: latency/run_sql/p50_ms, fmt: f0}
  run_sql_p95_ms: {file: metrics/tool_check.json, path: latency/run_sql/p95_ms, fmt: f0}
  run_sql_calls: {file: metrics/tool_check.json, path: latency/run_sql/calls, fmt: int}
  sample_rows_p50_ms: {file: metrics/tool_check.json, path: latency/sample_rows/p50_ms, fmt: f0}
  sample_rows_max_ms: {file: metrics/tool_check.json, path: latency/sample_rows/max_ms, fmt: int}
  validate_chart_p50_ms: {file: metrics/tool_check.json, path: latency/validate_chart/p50_ms, fmt: f1}

  # the evaluation harness: the project's scoring against BIRD's official evaluator, the
  # question sets, the hand-written banking set
  ex_validation_cases: {file: metrics/ex_validation.json, path: identical_ex/cases, fmt: int}
  ex_validation_identical: {file: metrics/ex_validation.json, path: identical_ex/identical, fmt: int}
  soft_f1_validation_identical: {file: metrics/ex_validation.json, path: identical_soft_f1/identical, fmt: int}
  ex_validation_gold: {file: metrics/ex_validation.json, path: parts/gold/cases, fmt: int}
  ex_validation_gold_right: {file: metrics/ex_validation.json, path: parts/gold/project_ex_1, fmt: int}
  ex_validation_mutants: {file: metrics/ex_validation.json, path: parts/mutant/cases, fmt: int}
  ex_validation_mutants_right: {file: metrics/ex_validation.json, path: parts/mutant/official_ex_1, fmt: int}
  ex_validation_edge: {file: metrics/ex_validation.json, path: parts/edge/cases, fmt: int}
  ex_validation_divergence: {file: metrics/ex_validation.json, path: parts/divergence/cases, fmt: int}
  ex_timeout_s: {file: metrics/ex_validation.json, path: project/timeout_s, fmt: int}
  parallel_gold_cases: {file: metrics/ex_validation.json, path: parallel_plans/gold_cases, fmt: int}
  parallel_gold_right: {file: metrics/ex_validation.json, path: parallel_plans/official_ex_1, fmt: int}
  parallel_gold_wrong: {expr: parallel_gold_cases - parallel_gold_right, fmt: int}
  gold_reads_the_clock: {file: metrics/ex_validation.json, path: gold_drift/reads_the_clock, count_where: {}, fmt: int}
  split_pilot: {file: metrics/splits.json, path: sizes/pilot, fmt: int}
  split_ablation: {file: metrics/splits.json, path: sizes/ablation, fmt: int}
  split_held_out: {file: metrics/splits.json, path: sizes/held_out, fmt: int}
  own_set_questions: {file: metrics/own_set_gold.json, path: questions, fmt: int}

# Decimals and percentages the templates may contain outside a placeholder: version numbers,
# never results.
allowed_literals:
  - "3.12" # the Python version
  - "4.0" # CC BY-SA 4.0, the licence of the BIRD data
  - "95%" # the level of every interval, fixed in configs/eval.yaml
