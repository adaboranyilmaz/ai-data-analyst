- question_id: 865
  db_id: formula_1
  question: For all the drivers who finished the game in race No. 592, who is the oldest?
  hint: drivers who finished the race refers to time is not empty (i.e. time IS NOT NULL); race number
    refers to raceId; date of birth refers to drivers.dob; The larger the birthday value, the younger
