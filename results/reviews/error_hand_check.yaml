- question_id: 880
  db_id: formula_1
  question: Paul di Resta was in the No. 853 race, what percent faster did he finish in the 853rd race
    than the next race for the fastest lap speed?
  hint: Paul di Resta refers to the full name of the driver; Full name of the driver refers to drivers.forename
    ='Paul' and drivers.surname = 'di Resta'; race number refers to raceId; percentage = DIVIDE(SUBTRACT(fastestLapSpeed(raceId
    = 853), (fastestLapSpeed (raceId = 854)) * 100 , (fastestLapSpeed(raceId = 853))
  answer_sql: "WITH speeds AS (\n  SELECT r.raceid, CAST(res.fastestlapspeed AS REAL) AS speed\n  FROM\
    \ results res\n  JOIN drivers d ON res.driverid = d.driverid\n  JOIN races r ON res.raceid = r.raceid\n\
    \  WHERE d.forename = 'Paul' AND d.surname = 'di Resta'\n    AND r.raceid IN (853, 854)\n)\nSELECT\n\
    \  CAST((MAX(CASE WHEN raceid = 853 THEN speed END) - MAX(CASE WHEN raceid = 854 THEN speed END))\
    \ AS REAL) * 100\n  / MAX(CASE WHEN raceid = 853 THEN speed END) AS pct_faster\nFROM speeds;"
  expert_sql: SELECT (SUM(CASE WHEN T2.raceId = 853 THEN T2.fastestLapSpeed::numeric ELSE 0 END) - SUM(CASE
    WHEN T2.raceId = 854 THEN T2.fastestLapSpeed::numeric ELSE 0 END)) * 100 / NULLIF(SUM(CASE WHEN T2.raceId
    = 853 THEN T2.fastestLapSpeed::numeric ELSE 0 END), 0) FROM drivers AS T1 INNER JOIN results AS T2
    ON T2.driverId = T1.driverId WHERE T1.forename = 'Paul' AND T1.surname = 'di Resta'
  outcome: ok
  relation: disjoint
  hand_category: format_only
  expert_questionable: false
  note: The same percentage, computed in single-precision floats where the expert uses numeric.
