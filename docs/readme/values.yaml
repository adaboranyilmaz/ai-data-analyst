# Every number in README.md and TECHNICAL_REPORT.md, by name: the results file it comes from
# (a path under results/), the field inside it (`/`-separated; list items by index) and its
# format (`fmt` in scripts/90_readme.py). `expr` is arithmetic over other names;
# `count_where`, `sum_of` and `mean_of` summarize a list; `pending: true` renders TBD until
# the result exists. Edit this file or the templates, never the rendered documents.

values:
  # the benchmark data and its dictionaries
  bird_questions: {file: metrics/data_stats.json, path: gold/questions, fmt: int}
  gold_executed: {file: metrics/data_stats.json, path: gold/executed_ok, fmt: int}
  gold_excluded: {file: metrics/data_stats.json, path: gold/excluded, fmt: int}
  bird_databases: {file: metrics/data_stats.json, path: totals/databases, fmt: int}
  bird_tables: {file: metrics/data_stats.json, path: totals/tables, fmt: int}
  bird_columns: {file: metrics/data_stats.json, path: totals/columns, fmt: int}
  bird_columns_described: {file: metrics/data_stats.json, path: totals/columns_described, fmt: int}
  financial_trans_rows: {file: metrics/data_stats.json, path: financial/row_counts/trans/loaded, fmt: int}
  financial_code_values: {file: metrics/data_stats.json, path: financial/code_values_present, fmt: int}
  financial_code_values_translated: {file: metrics/data_stats.json, path: financial/code_values_translated, fmt: int}

  # the safe execution layer: database hardening, the security suite, the tools
  hardened_functions: {file: metrics/db_hardening.json, path: databases/bird/functions_closed, fmt: int}
  hardened_views: {file: metrics/db_hardening.json, path: databases/bird/views_closed, fmt: int}
  schema_roles: {file: metrics/db_hardening.json, path: databases/bird/schema_roles/roles, fmt: int}
  security_attacks: {file: metrics/security_suite.json, path: attacks, fmt: int}
  security_names_listed: {file: metrics/security_suite.json, path: summary/database/documented_exception, fmt: int}
  security_parser_breach: {file: metrics/security_suite.json, path: summary/parser/breach, fmt: int}
  security_database_breach: {file: metrics/security_suite.json, path: summary/database/breach, fmt: int}
  security_privileges_breach: {file: metrics/security_suite.json, path: summary/privileges/breach, fmt: int}
  security_breaches: {expr: security_parser_breach + security_database_breach + security_privileges_breach, fmt: int}
  security_timeout: {file: metrics/security_suite.json, path: settings/timeout_s, fmt: int}
  guard_gold_accepted: {file: metrics/tool_check.json, path: guard/accepted, fmt: int}
  tools_gold_reproduced: {file: metrics/tool_check.json, path: execution/same_result_as_gold, fmt: int}
  run_sql_p50_ms: {file: metrics/tool_check.json, path: latency/run_sql/p50_ms, fmt: f0}
  run_sql_p95_ms: {file: metrics/tool_check.json, path: latency/run_sql/p95_ms, fmt: f0}
  run_sql_calls: {file: metrics/tool_check.json, path: latency/run_sql/calls, fmt: int}
  sample_rows_p50_ms: {file: metrics/tool_check.json, path: latency/sample_rows/p50_ms, fmt: f0}
  sample_rows_max_ms: {file: metrics/tool_check.json, path: latency/sample_rows/max_ms, fmt: int}
  validate_chart_p50_ms: {file: metrics/tool_check.json, path: latency/validate_chart/p50_ms, fmt: f1}

  # the evaluation harness: the project's scoring against BIRD's official evaluator, the
  # question sets, the hand-written banking set
  ex_validation_cases: {file: metrics/ex_validation.json, path: identical_ex/cases, fmt: int}
  ex_validation_identical: {file: metrics/ex_validation.json, path: identical_ex/identical, fmt: int}
  soft_f1_validation_identical: {file: metrics/ex_validation.json, path: identical_soft_f1/identical, fmt: int}
  ex_validation_gold: {file: metrics/ex_validation.json, path: parts/gold/cases, fmt: int}
  ex_validation_gold_right: {file: metrics/ex_validation.json, path: parts/gold/project_ex_1, fmt: int}
  ex_validation_mutants: {file: metrics/ex_validation.json, path: parts/mutant/cases, fmt: int}
  ex_validation_mutants_right: {file: metrics/ex_validation.json, path: parts/mutant/official_ex_1, fmt: int}
  ex_validation_edge: {file: metrics/ex_validation.json, path: parts/edge/cases, fmt: int}
  ex_validation_divergence: {file: metrics/ex_validation.json, path: parts/divergence/cases, fmt: int}
  ex_timeout_s: {file: metrics/ex_validation.json, path: project/timeout_s, fmt: int}
  parallel_gold_cases: {file: metrics/ex_validation.json, path: parallel_plans/gold_cases, fmt: int}
  parallel_gold_right: {file: metrics/ex_validation.json, path: parallel_plans/official_ex_1, fmt: int}
  parallel_gold_wrong: {expr: parallel_gold_cases - parallel_gold_right, fmt: int}
  gold_reads_the_clock: {file: metrics/ex_validation.json, path: gold_drift/reads_the_clock, count_where: {}, fmt: int}
  split_pilot: {file: metrics/splits.json, path: sizes/pilot, fmt: int}
  split_ablation: {file: metrics/splits.json, path: sizes/ablation, fmt: int}
  split_held_out: {file: metrics/splits.json, path: sizes/held_out, fmt: int}
  own_set_questions: {file: metrics/own_set_gold.json, path: questions, fmt: int}

  # the analyst: the design comparison (ablation set, with evidence)
  abl_sonnet_d1_ex: {file: metrics/ablation.json, path: runs/claude-sonnet-5/d1/execution_accuracy/estimate, fmt: pct1}
  abl_sonnet_d3_ex: {file: metrics/ablation.json, path: runs/claude-sonnet-5/d3/execution_accuracy/estimate, fmt: pct1}
  abl_sonnet_d4_ex: {file: metrics/ablation.json, path: runs/claude-sonnet-5/d4/execution_accuracy/estimate, fmt: pct1}
  abl_sonnet_d1_cost_q: {file: metrics/ablation.json, path: runs/claude-sonnet-5/d1/cost/per_question_usd, fmt: usd4}
  abl_d1_minus_d3: {file: metrics/ablation.json, path: pairs/d1 - d3/execution_accuracy/estimate, fmt: pp1}
  abl_d1_minus_d3_ci: {file: metrics/ablation.json, path: pairs/d1 - d3/execution_accuracy, fmt: ppiv1}
  abl_d4_minus_d3: {file: metrics/ablation.json, path: predictions/P04/d4_minus_d3/estimate, fmt: pp1}
  abl_d4_minus_d3_ci: {file: metrics/ablation.json, path: predictions/P04/d4_minus_d3, fmt: ppiv1}
  abl_haiku_d1_ex: {file: metrics/ablation.json, path: runs/claude-haiku-4-5/d1/execution_accuracy/estimate, fmt: pct1}
  abl_haiku_d3_ex: {file: metrics/ablation.json, path: runs/claude-haiku-4-5/d3/execution_accuracy/estimate, fmt: pct1}
  abl_local_d1_ex: {file: metrics/ablation.json, path: runs/qwen2.5:3b-instruct/d1/execution_accuracy/estimate, fmt: pct1}
  abl_local_d3_ex: {file: metrics/ablation.json, path: runs/qwen2.5:3b-instruct/d3/execution_accuracy/estimate, fmt: pct1}

  # the winning design on the benchmark (held-out set: the headline)
  held_ex: {file: metrics/benchmark_main.json, path: winner/held_out/execution_accuracy/estimate, fmt: pct1}
  held_ex_ci: {file: metrics/benchmark_main.json, path: winner/held_out/execution_accuracy, fmt: pctiv1}
  held_questions: {file: metrics/benchmark_main.json, path: winner/held_out/questions, fmt: int}
  all_ex: {file: metrics/benchmark_main.json, path: winner/all/execution_accuracy/estimate, fmt: pct1}
  held_auroc: {file: metrics/benchmark_main.json, path: winner/held_out/calibration/auroc/estimate, fmt: f2}
  held_auroc_ci: {file: metrics/benchmark_main.json, path: winner/held_out/calibration/auroc, fmt: civ2}
  held_ece: {file: metrics/benchmark_main.json, path: winner/held_out/calibration/ece/estimate, fmt: f2}
  held_brier: {file: metrics/benchmark_main.json, path: winner/held_out/calibration/brier/estimate, fmt: f3}
  held_aurc: {file: metrics/benchmark_main.json, path: winner/held_out/selective/aurc/estimate, fmt: f3}
  held_acc_at_80: {file: metrics/benchmark_main.json, path: winner/held_out/selective/accuracy_at_80/estimate, fmt: pct1}
  held_simple_ex: {file: metrics/benchmark_main.json, path: winner/held_out/by_difficulty/simple/execution_accuracy/estimate, fmt: pct1}
  held_challenging_ex: {file: metrics/benchmark_main.json, path: winner/held_out/by_difficulty/challenging/execution_accuracy/estimate, fmt: pct1}
  held_cost_correct: {file: metrics/benchmark_main.json, path: winner/held_out/cost/per_correct_answer_usd/estimate, fmt: usd4}
  noev_ex: {file: metrics/benchmark_main.json, path: without_evidence/ablation/execution_accuracy/estimate, fmt: pct1}
  evidence_gain: {file: metrics/benchmark_main.json, path: evidence_minus_no_evidence/execution_accuracy/estimate, fmt: pp1}
  evidence_gain_ci: {file: metrics/benchmark_main.json, path: evidence_minus_no_evidence/execution_accuracy, fmt: ppiv1}
  haiku_minus_sonnet_d1: {file: metrics/benchmark_main.json, path: haiku_minus_sonnet/execution_accuracy/estimate, fmt: pp1}
  # the same differences as unsigned points, for prose that says which way they go
  evidence_gain_pts: {expr: evidence_gain * 100, fmt: f1}
  abl_d1_minus_d3_pts: {expr: abl_d1_minus_d3 * 100, fmt: f1}
  haiku_behind_pts: {expr: -haiku_minus_sonnet_d1 * 100, fmt: f1}

  # the winning design on the hand-written banking set
  own_ab_ex: {file: metrics/own_set.json, path: predictions/P12/standard_and_multi_step_ex/estimate, fmt: pct1}
  own_ab_ex_ci: {file: metrics/own_set.json, path: predictions/P12/standard_and_multi_step_ex, fmt: pctiv1}
  own_c_success: {file: metrics/own_set.json, path: categories/c/success/estimate, fmt: pct1}
  own_c_reviewed: {file: metrics/own_set.json, path: categories/c/reviewed_success/estimate, fmt: pct1}
  own_d_success: {file: metrics/own_set.json, path: categories/d/success/estimate, fmt: pct1}
  own_e_success: {file: metrics/own_set.json, path: categories/e/success/estimate, fmt: pct1}
  own_e_reviewed: {file: metrics/own_set.json, path: categories/e/reviewed_success/estimate, fmt: pct1}
  own_clarify_ab: {file: metrics/own_set.json, path: not_called_for_ab/clarifying_question/estimate, fmt: pct1}
  own_reviewed: {file: metrics/own_set.json, path: review/checked, fmt: int}

  # calibrated confidence and declining (fitted and chosen on the ablation set, reported on the
  # held-out set)
  cal_raw_ece: {file: metrics/calibration.json, path: held_out/stated_raw/ece/estimate, fmt: f3}
  cal_platt_ece: {file: metrics/calibration.json, path: held_out/stated_platt/ece/estimate, fmt: f3}
  cal_platt_ece_ci: {file: metrics/calibration.json, path: held_out/stated_platt/ece, fmt: civ3}
  cal_iso_ece: {file: metrics/calibration.json, path: held_out/stated_isotonic/ece/estimate, fmt: f3}
  cal_raw_brier: {file: metrics/calibration.json, path: held_out/stated_raw/brier/estimate, fmt: f3}
  cal_platt_brier: {file: metrics/calibration.json, path: held_out/stated_platt/brier/estimate, fmt: f3}
  cal_platt_slope: {file: metrics/calibration.json, path: calibration_split/calibrators/platt/slope, fmt: f2}
  decline_target: {file: metrics/calibration.json, path: decline/target_accuracy, fmt: pct0}
  decline_raw_threshold: {file: metrics/calibration.json, path: decline/raw_confidence_at_threshold, fmt: f2}
  decline_cal_answered: {file: metrics/calibration.json, path: decline/chosen_on_calibration_split/chosen/answered, fmt: int}
  decline_cal_accuracy: {file: metrics/calibration.json, path: decline/chosen_on_calibration_split/chosen/accuracy, fmt: pct1}
  decline_next_answered: {file: metrics/calibration.json, path: decline/chosen_on_calibration_split/candidates/2/answered, fmt: int}
  decline_next_accuracy: {file: metrics/calibration.json, path: decline/chosen_on_calibration_split/candidates/2/accuracy, fmt: pct1}
  decline_held_answered: {file: metrics/calibration.json, path: decline/held_out/answered, fmt: int}
  decline_held_coverage: {file: metrics/calibration.json, path: decline/held_out/coverage/estimate, fmt: pct1}
  decline_held_coverage_ci: {file: metrics/calibration.json, path: decline/held_out/coverage, fmt: pctiv1}
  decline_held_accuracy: {file: metrics/calibration.json, path: decline/held_out/accuracy/estimate, fmt: pct1}
  decline_held_accuracy_ci: {file: metrics/calibration.json, path: decline/held_out/accuracy, fmt: pctiv1}

  # the critic and the combined confidence (held-out set)
  critic_reviewed_held: {file: metrics/calibration.json, path: critic/held_out/reviewed, fmt: int}
  critic_verdict_correct: {file: metrics/calibration.json, path: critic/held_out/verdicts/correct, fmt: int}
  critic_verdict_incorrect: {file: metrics/calibration.json, path: critic/held_out/verdicts/incorrect, fmt: int}
  critic_verdict_unsure: {file: metrics/calibration.json, path: critic/held_out/verdicts/unsure, fmt: int}
  critic_cost_held: {file: metrics/calibration.json, path: critic/held_out/cost_usd, fmt: usd2}
  rc_stated_aurc: {file: metrics/risk_coverage.json, path: held_out/stated_platt/aurc/estimate, fmt: f3}
  rc_critic_aurc: {file: metrics/risk_coverage.json, path: held_out/critic_raw/aurc/estimate, fmt: f3}
  rc_critic_auroc: {file: metrics/risk_coverage.json, path: held_out/critic_raw/auroc/estimate, fmt: f2}
  rc_zeroed_aurc: {file: metrics/risk_coverage.json, path: held_out/stated_zeroed_without_result/aurc/estimate, fmt: f3}
  rc_combined_aurc: {file: metrics/risk_coverage.json, path: held_out/combined_exploratory/aurc/estimate, fmt: f3}
  rc_combined_auroc: {file: metrics/risk_coverage.json, path: held_out/combined_exploratory/auroc/estimate, fmt: f2}
  rc_oracle_aurc: {file: metrics/risk_coverage.json, path: oracle_aurc, fmt: f3}
  rc_critic_minus_stated: {file: metrics/risk_coverage.json, path: comparisons/critic_minus_stated_platt/aurc/estimate, fmt: sf3}
  rc_critic_minus_stated_ci: {file: metrics/risk_coverage.json, path: comparisons/critic_minus_stated_platt/aurc, fmt: civ3}
  rc_critic_minus_zeroed: {file: metrics/risk_coverage.json, path: comparisons/critic_minus_stated_zeroed_without_result/aurc/estimate, fmt: sf3}
  rc_critic_minus_zeroed_ci: {file: metrics/risk_coverage.json, path: comparisons/critic_minus_stated_zeroed_without_result/aurc, fmt: civ3}
  rc_combined_minus_stated: {file: metrics/risk_coverage.json, path: comparisons/combined_minus_stated_platt/aurc/estimate, fmt: sf3}
  rc_combined_minus_stated_ci: {file: metrics/risk_coverage.json, path: comparisons/combined_minus_stated_platt/aurc, fmt: civ3}

  # escalation to Claude Opus 5.5 (ablation set, paired with Claude Sonnet 5), and the router
  # (held-out set)
  esc_opus_ex: {file: metrics/escalation.json, path: opus/execution_accuracy/estimate, fmt: pct1}
  esc_opus_ex_ci: {file: metrics/escalation.json, path: opus/execution_accuracy, fmt: pctiv1}
  esc_sonnet_ex: {file: metrics/escalation.json, path: sonnet/execution_accuracy/estimate, fmt: pct1}
  esc_gain: {file: metrics/escalation.json, path: rule/gain/estimate, fmt: pp1}
  esc_gain_ci: {file: metrics/escalation.json, path: rule/gain, fmt: ppiv1}
  esc_opus_cost_q: {file: metrics/escalation.json, path: cost_per_correct/0/cost_per_question_usd, fmt: usd4}
  esc_sonnet_cost_q: {file: metrics/escalation.json, path: cost_per_correct/1/cost_per_question_usd, fmt: usd4}
  esc_opus_cost_correct: {file: metrics/escalation.json, path: cost_per_correct/0/cost_per_correct_answer_usd, fmt: usd4}
  esc_sonnet_cost_correct: {file: metrics/escalation.json, path: cost_per_correct/1/cost_per_correct_answer_usd, fmt: usd4}
  esc_opus_output: {file: metrics/escalation.json, path: opus_behaviour/output_tokens_per_question/mean, fmt: int}
  esc_reminders: {file: metrics/escalation.json, path: opus_behaviour/needed_the_reminder, fmt: int}
  esc_opus_auroc: {file: metrics/escalation.json, path: opus/calibration/auroc/estimate, fmt: f2}
  router_questions: {file: metrics/router.json, path: questions, fmt: int}
  router_routed: {file: metrics/router.json, path: routed, fmt: int}
  router_kept: {file: metrics/router.json, path: kept, fmt: int}
  router_ex: {file: metrics/router.json, path: routed_system/execution_accuracy/estimate, fmt: pct1}
  router_ex_ci: {file: metrics/router.json, path: routed_system/execution_accuracy, fmt: pctiv1}
  router_sonnet_ex: {file: metrics/router.json, path: sonnet_alone/execution_accuracy/estimate, fmt: pct1}
  router_sonnet_ex_ci: {file: metrics/router.json, path: sonnet_alone/execution_accuracy, fmt: pctiv1}
  router_gain: {file: metrics/router.json, path: routed_minus_sonnet/execution_accuracy/estimate, fmt: pp1}
  router_gain_ci: {file: metrics/router.json, path: routed_minus_sonnet/execution_accuracy, fmt: ppiv1}
  router_cost_correct: {file: metrics/router.json, path: cost_per_correct/0/cost_per_correct_answer_usd, fmt: usd4}
  router_sonnet_cost_correct: {file: metrics/router.json, path: cost_per_correct/1/cost_per_correct_answer_usd, fmt: usd4}
  router_opus_ex: {file: metrics/router.json, path: exploratory/opus_alone/execution_accuracy/estimate, fmt: pct1}
  router_opus_ex_ci: {file: metrics/router.json, path: exploratory/opus_alone/execution_accuracy, fmt: pctiv1}
  router_opus_minus_sonnet: {file: metrics/router.json, path: exploratory/opus_minus_sonnet/execution_accuracy/estimate, fmt: pp1}
  router_opus_minus_sonnet_ci: {file: metrics/router.json, path: exploratory/opus_minus_sonnet/execution_accuracy, fmt: ppiv1}
  router_opus_minus_routed: {file: metrics/router.json, path: exploratory/opus_alone_minus_routed/execution_accuracy/estimate, fmt: pp1}
  router_opus_minus_routed_ci: {file: metrics/router.json, path: exploratory/opus_alone_minus_routed/execution_accuracy, fmt: ppiv1}
  router_opus_cost_correct: {file: metrics/router.json, path: cost_per_correct/2/cost_per_correct_answer_usd, fmt: usd4}
  router_routed_sonnet_ex: {file: metrics/router.json, path: exploratory/on_routed_questions/sonnet/execution_accuracy/estimate, fmt: pct1}
  router_routed_opus_ex: {file: metrics/router.json, path: exploratory/on_routed_questions/opus/execution_accuracy/estimate, fmt: pct1}
  router_kept_sonnet_ex: {file: metrics/router.json, path: exploratory/on_kept_questions/sonnet/execution_accuracy/estimate, fmt: pct1}
  router_kept_opus_ex: {file: metrics/router.json, path: exploratory/on_kept_questions/opus/execution_accuracy/estimate, fmt: pct1}
  router_opus_spent: {file: metrics/router.json, path: spent/claude-opus-5-5/spent_usd, fmt: usd2}
  router_opus_batch_price: {file: metrics/router.json, path: spent/claude-opus-5-5/at_batch_price_usd, fmt: usd2}
  router_direct_questions: {file: metrics/router.json, path: spent/claude-opus-5-5/questions_with_direct_calls, fmt: int}

  # the framework comparison (ablation set, from stored responses)
  fw_questions: {file: metrics/framework_comparison.json, path: questions, fmt: int}
  fw_identical: {file: metrics/framework_comparison.json, path: requests_identical, fmt: int}
  fw_calls: {file: metrics/framework_comparison.json, path: model_calls_per_question/graph/estimate, fmt: f2}
  fw_checkpoints: {file: metrics/framework_comparison.json, path: checkpoints_per_question, fmt: int}
  fw_graph_p50: {file: metrics/framework_comparison.json, path: seconds_per_question_cached_calls/graph/p50, fmt: f3}
  fw_own_p50: {file: metrics/framework_comparison.json, path: seconds_per_question_cached_calls/own_loop/p50, fmt: f3}
  fw_graph_p95: {file: metrics/framework_comparison.json, path: seconds_per_question_cached_calls/graph/p95, fmt: f3}
  fw_own_p95: {file: metrics/framework_comparison.json, path: seconds_per_question_cached_calls/own_loop/p95, fmt: f3}
  fw_graph_p50_ms: {expr: fw_graph_p50 * 1000, fmt: f0}
  fw_own_p50_ms: {expr: fw_own_p50 * 1000, fmt: f0}
  fw_graph_p95_ms: {expr: fw_graph_p95 * 1000, fmt: f0}
  fw_own_p95_ms: {expr: fw_own_p95 * 1000, fmt: f0}
  fw_cost_correct: {file: metrics/framework_comparison.json, path: cost_per_correct_answer_usd/graph, fmt: usd4}
  fw_graph_lines: {file: metrics/framework_comparison.json, path: code_lines/graph_arm/lines, fmt: int}
  fw_own_lines: {file: metrics/framework_comparison.json, path: code_lines/own_loop/lines, fmt: int}

  # near misses among the winner's wrong held-out answers
  nm_wrong: {file: metrics/near_miss.json, path: wrong_with_a_result, fmt: int}
  nm_near: {file: metrics/near_miss.json, path: near_misses, fmt: int}
  nm_columns: {file: metrics/near_miss.json, path: by_kind/columns, fmt: int}
  nm_rounding: {file: metrics/near_miss.json, path: by_kind/rounding, fmt: int}
  # held-out accuracy if the near misses counted as right (a secondary view; EX stays the measure)
  held_ex_up_to_format: {expr: held_ex + nm_near / held_questions, fmt: pct1}

  # where the winner's wrong held-out answers go wrong
  ea_wrong: {file: metrics/error_analysis.json, path: wrong, fmt: int}
  ea_no_result: {file: metrics/error_analysis.json, path: categories/no_result, fmt: int}
  ea_refused: {file: metrics/error_analysis.json, path: no_result_kinds/refused, fmt: int}
  ea_failed: {file: metrics/error_analysis.json, path: no_result_kinds/error, fmt: int}
  ea_format_only: {file: metrics/error_analysis.json, path: categories/format_only, fmt: int}
  ea_tables: {file: metrics/error_analysis.json, path: categories/tables, fmt: int}
  ea_join: {file: metrics/error_analysis.json, path: categories/join, fmt: int}
  ea_filter: {file: metrics/error_analysis.json, path: categories/filter, fmt: int}
  ea_filter_value: {file: metrics/error_analysis.json, path: filter_kinds/different_value, fmt: int}
  ea_computation: {file: metrics/error_analysis.json, path: categories/computation, fmt: int}
  ea_output: {file: metrics/error_analysis.json, path: categories/output, fmt: int}
  ea_order_limit: {file: metrics/error_analysis.json, path: categories/order_limit, fmt: int}
  ea_other: {file: metrics/error_analysis.json, path: categories/other, fmt: int}
  ea_logic: {expr: ea_tables + ea_join + ea_filter + ea_computation + ea_output + ea_order_limit, fmt: int}
  ea_several: {file: metrics/error_analysis.json, path: several_parts_differ, fmt: int}
  ea_disjoint: {file: metrics/error_analysis.json, path: relations/disjoint, fmt: int}
