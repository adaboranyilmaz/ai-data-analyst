- question_id: 587
  db_id: codebase_community
  question: Calculate the average view count of each post tagged as 'humor' and list the title and the
    comment of each post.
  hint: tagged as  'humor' refers to tag = '<humor>'; comment of the post refers to Text; average view
    count = AVG(ViewCount)
  answer_sql: "WITH humor_posts AS (\n  SELECT p.id, p.title, p.viewcount\n  FROM posts p\n  WHERE p.tags\
    \ LIKE '%<humor>%'\n)\nSELECT\n  (SELECT CAST(AVG(viewcount) AS REAL) FROM humor_posts) AS avg_view_count,\n\
    \  hp.title,\n  ph.text AS comment\nFROM humor_posts hp\nLEFT JOIN posthistory ph ON hp.id = ph.postid;"
  expert_sql: SELECT AVG(T2.ViewCount) AS AverageViewCount, T2.Title, T1.Text FROM comments AS T1 INNER
    JOIN posts AS T2 ON T2.Id = T1.PostId WHERE T2.Tags = '<humor>' GROUP BY T2.Title, T1.Text
  outcome: ok
  relation: disjoint
  hand_category: tables
  expert_questionable: false
  note: Takes the comments from posthistory instead of comments, and matches the tag with LIKE; also one
    average over all posts instead of each post's.
- question_id: 639
  db_id: codebase_community
  question: Based on posts posted by Community, calculate the percentage of posts that use the R language.
  hint: DIVIDE(COUNT(PostId WHERE TagName = 'r')), (COUNT(PostId WHERE DisplayName = 'Community')) as
    percentage; R language refers to tagname = 'r'
  answer_sql: 'SELECT CAST(COUNT(CASE WHEN p.tags LIKE ''%<r>%'' THEN 1 END) AS REAL) * 100 / COUNT(*)
    AS percentage

    FROM posts p

    JOIN users u ON p.owneruserid = u.id

    WHERE u.displayname = ''Community'''
  expert_sql: SELECT CAST(SUM(CASE WHEN T3.TagName = 'r' THEN 1 ELSE 0 END) AS REAL) * 100 / NULLIF(COUNT(T1.Id),
    0) FROM users AS T1 INNER JOIN postHistory AS T2 ON T1.Id = T2.UserId INNER JOIN tags AS T3 ON T3.ExcerptPostId
    = T2.PostId WHERE T1.DisplayName = 'Community'
  outcome: ok
  relation: disjoint
  hand_category: tables
  expert_questionable: true
  note: Counts Community's posts tagged r in posts; the expert joins postHistory to tags through ExcerptPostId,
    which does not count posts that use R.
- question_id: 726
  db_id: superhero
  question: Rank heroes published by Marvel Comics by their height in descending order.
  hint: name refers to superhero_name; the tallest hero refers to MAX(height_cm); published by Marvel
    Comics refers to publisher_name = 'Marvel Comics'
  answer_sql: "SELECT s.superhero_name, s.height_cm,\n       RANK() OVER (ORDER BY s.height_cm DESC) AS\
    \ height_rank\nFROM superhero s\nJOIN publisher p ON s.publisher_id = p.id\nWHERE p.publisher_name\
    \ = 'Marvel Comics'\nORDER BY s.height_cm DESC;"
  expert_sql: SELECT superhero_name, height_cm, RANK() OVER (ORDER BY height_cm DESC NULLS LAST) AS HeightRank
    FROM superhero INNER JOIN publisher ON superhero.publisher_id = publisher.id WHERE publisher.publisher_name
    = 'Marvel Comics'
  outcome: ok
  relation: disjoint
  hand_category: computation
  expert_questionable: false
  note: RANK() over height descending puts heroes with no height first (PostgreSQL's default), so the
    ranks shift; the expert puts them last.
