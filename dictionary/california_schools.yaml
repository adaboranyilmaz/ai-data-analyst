        name: CDSCode
        description: CDSCode
        data_format: text
      ncesdist:
        bird_name: NCESDist
        name: National Center for Educational Statistics school district identification number
        description: This field represents the 7-digit National Center for Educational Statistics (NCES)
          school district identification number. The first 2 digits identify the state and the last 5
          digits identify the school district. Combined, they make a unique 7-digit ID for each school
          district.
        data_format: text
      ncesschool:
        bird_name: NCESSchool
        name: National Center for Educational Statistics school identification number
        description: This field represents the 5-digit NCES school identification number. The NCESSchool
          combined with the NCESDist form a unique 12-digit ID for each school.
        data_format: text
      statustype:
        bird_name: StatusType
        name: StatusType
        description: This field identifies the status of the district.
        data_format: text
        value_description: |-
          Definitions of the valid status types are listed below:
          ·       Active: The district is in operation and providing instructional services.
          ·       Closed: The district is not in operation and no longer providing instructional services.
          ·       Merged: The district has combined with another district or districts.
          ·       Pending: The district has not opened for operation and instructional services yet, but plans to open within the next 9–12 months.
