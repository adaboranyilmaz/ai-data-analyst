  question: State the names and full communication address of high schools in Monterey which has more
    than 800 free or reduced price meals for ages 15-17?
  hint: Full communication address should include Street, City, State and zip code if any.
  answer_sql: "SELECT\n    s.school AS school_name,\n    s.street AS street,\n    s.city AS city,\n  \
    \  s.state AS state,\n    s.zip AS zip\nFROM frpm f\nJOIN schools s ON f.cdscode = s.cdscode\nWHERE\
    \ f.\"County Name\" = 'Monterey'\n  AND f.\"School Type\" = 'High Schools (Public)'\n  AND f.\"FRPM\
    \ Count (Ages 5-17)\" > 800"
  expert_sql: SELECT T1."School Name", T2.Street, T2.City, T2.State, T2.Zip FROM frpm AS T1 INNER JOIN
    schools AS T2 ON T1.CDSCode = T2.CDSCode WHERE T2.County = 'Monterey' AND T1."Free Meal Count (Ages
    5-17)" > 800 AND T1."School Type" = 'High Schools (Public)'
  outcome: ok
  relation: superset
  hand_category: filter
  expert_questionable: true
  note: Uses the FRPM count (free or reduced price), as the question asks; the expert uses the free-meal
    count only, a narrower question.
- question_id: 28
  db_id: california_schools
  question: Consider the average difference between K-12 enrollment and 15-17 enrollment of schools that
    are locally funded, list the names and DOC type of schools which has a difference above this average.
  hint: Difference between K-12 enrollment and 15-17 enrollment can be computed by `Enrollment (K-12)`
    - `Enrollment (Ages 5-17)`
  answer_sql: "WITH locally_funded AS (\n  SELECT\n    f.cdscode,\n    f.\"School Name\" AS school_name,\n\
    \    s.doctype,\n    (f.\"Enrollment (K-12)\" - f.\"Enrollment (Ages 5-17)\") AS diff\n  FROM frpm\
    \ f\n  JOIN schools s ON f.cdscode = s.cdscode\n  WHERE s.fundingtype = 'Locally funded'\n    AND\
    \ f.\"Enrollment (K-12)\" IS NOT NULL\n    AND f.\"Enrollment (Ages 5-17)\" IS NOT NULL\n),\navg_diff\
    \ AS (\n  SELECT AVG(diff) AS avg_d FROM locally_funded\n)\nSELECT lf.school_name, lf.doctype\nFROM\
    \ locally_funded lf, avg_diff\nWHERE lf.diff > avg_diff.avg_d;"
  expert_sql: SELECT T2.School, T2.DOC FROM frpm AS T1 INNER JOIN schools AS T2 ON T1.CDSCode = T2.CDSCode
    WHERE T2.FundingType = 'Locally funded' AND (T1."Enrollment (K-12)" - T1."Enrollment (Ages 5-17)")
    > (SELECT AVG(T3."Enrollment (K-12)" - T3."Enrollment (Ages 5-17)") FROM frpm AS T3 INNER JOIN schools
    AS T4 ON T3.CDSCode = T4.CDSCode WHERE T4.FundingType = 'Locally funded')
  outcome: refused
  relation: null
  hand_category: no_result
  expert_questionable: false
  note: Refused by the checker (a comma join); the logic otherwise follows the expert's.
- question_id: 95
  db_id: financial
  question: List out the account numbers of clients who are youngest and have highest average salary?
  hint: If the person A's birthdate < B's birthdate, it means that person B is younger than person A;
    A11 refers to average salary
  answer_sql: "WITH client_acct AS (\n  SELECT c.client_id, c.birth_date, d.account_id, di.a11\n  FROM\
    \ client c\n  JOIN disp di ON di.client_id = c.client_id\n  JOIN account a ON a.account_id = di.account_id\n\
    \  JOIN district d ON d.district_id = c.district_id\n  JOIN district dd ON dd.district_id = a.district_id\n\
    )\nSELECT account_id\nFROM (\n  SELECT c.client_id, c.birth_date, di.account_id, dist.a11\n  FROM\
    \ client c\n  JOIN disp di ON di.client_id = c.client_id\n  JOIN district dist ON dist.district_id\
    \ = c.district_id\n) t\nWHERE birth_date = (SELECT MAX(birth_date) FROM client)\nORDER BY a11 DESC\n\
    LIMIT 1;"
  expert_sql: SELECT T1.account_id FROM account AS T1 INNER JOIN disp AS T2 ON T1.account_id = T2.account_id
    INNER JOIN client AS T3 ON T2.client_id = T3.client_id INNER JOIN district AS T4 ON T4.district_id
    = T1.district_id WHERE T2.client_id = (SELECT client_id FROM client ORDER BY birth_date DESC NULLS
    LAST LIMIT 1) GROUP BY T4.A11, T1.account_id
  outcome: error
  relation: null
  hand_category: no_result
  expert_questionable: false
  note: 'Fails: district has no account_id column.'
- question_id: 129
  db_id: financial
  question: Which are the top ten withdrawals (non-credit card) by district names for the month of January
    1996?
  hint: Non-credit card withdraws refers to type = 'VYDAJ'; January 1996 can be found by date LIKE '1996-01%'
    in the database; A2 means district names
  answer_sql: "SELECT d.a2 AS district_name, t.amount\nFROM trans t\nJOIN account a ON t.account_id =\
    \ a.account_id\nJOIN district d ON a.district_id = d.district_id\nWHERE t.type = 'VYDAJ'\n  AND CAST(t.date\
    \ AS TEXT) LIKE '1996-01%'\nORDER BY t.amount DESC\nLIMIT 10;"
  expert_sql: SELECT DISTINCT T1.A2 FROM district AS T1 INNER JOIN account AS T2 ON T1.district_id = T2.district_id
    INNER JOIN trans AS T3 ON T2.account_id = T3.account_id WHERE T3.type = 'VYDAJ' AND CAST(T3.date AS
    TEXT) LIKE '1996-01%' ORDER BY T1.A2 ASC LIMIT 10
  outcome: ok
  relation: same_row_count
  hand_category: computation
  expert_questionable: true
  note: Lists the ten largest withdrawals with their district; the expert lists ten distinct district
    names in alphabetical order, which ranks no withdrawal.
