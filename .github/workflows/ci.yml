# Lint, unit tests, the database-role tests and the security suite against the compose
# PostgreSQL, DVC status and the README check, on every pull request and on main. No step can
# call a model API: there is no key, and replay-only mode turns any cache miss into an error.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.3"
  PYTHONUTF8: "1"
  ANALYST_REPLAY_ONLY: "1"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install (locked, with the LangGraph arm's group so its tests run)
        run: uv sync --frozen --group langgraph
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Start PostgreSQL
        run: docker compose up -d --wait
      - name: Harden the database (closed system functions and views, schema roles)
        run: uv run python scripts/20_harden_db.py --no-results
      - name: Tests (the database tests may not skip)
        env:
          ANALYST_REQUIRE_DB: "1"
        run: uv run pytest -q -rs
      - name: DVC status
        run: uv run dvc status
      - name: README and report match the results files
        run: uv run python scripts/90_readme.py --check

  # The statistics sandbox: its image built from the lock file's pinned packages, then the tests
  # of its analyses and its security suite (every attack blocked, every control effective).
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install (locked)
        run: uv sync --frozen
      - name: The sandbox's requirements match the lock file
        run: uv run python scripts/70_build_sandbox.py --check
      - name: Build the sandbox image
        run: uv run python scripts/70_build_sandbox.py
      - name: Sandbox tests and security suite (they may not skip)
        env:
          ANALYST_REQUIRE_SANDBOX: "1"
        run: uv run pytest -q -rs -m sandbox
