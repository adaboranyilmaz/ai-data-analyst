  qualifying:
    bird_file: qualifying.csv
    columns:
      qualifyid:
        bird_name: qualifyId
        name: qualify Id
        description: the unique identification number identifying qualifying
        data_format: integer
        value_description: How does F1 Sprint qualifying work? Sprint qualifying is essentially a short-form
          Grand Prix – a race that is one-third the number of laps of the main event on Sunday. However,
          the drivers are battling for positions on the grid for the start of Sunday's race.
      raceid:
        bird_name: raceId
        name: race Id
        description: the identification number identifying each race
        data_format: integer
      driverid:
        bird_name: driverId
        name: driver Id
        description: the identification number identifying each driver
        data_format: integer
      constructorid:
        bird_name: constructorId
        name: constructor id
        description: constructor Id
        data_format: integer
      number:
        bird_name: number
        name: number
        description: number
        data_format: integer
      position:
        bird_name: position
        name: position
        description: position or track of circuit
        data_format: integer
      q1:
        bird_name: q1
        name: qualifying 1
        description: time in qualifying 1
        data_format: text
        value_description: |-
          in minutes / seconds / ...
          commonsense evidence:
          Q1 lap times determine pole position and the order of the front 10 positions on the grid. The slowest driver in Q1 starts 10th, the next starts ninth and so on.
          All 20 F1 drivers participate in the first period, called Q1, with each trying to set the fastest time possible. Those in the top 15 move on to the next period of qualifying, called Q2. The five slowest drivers are eliminated and will start the race in the last five positions on the grid.
      q2:
        bird_name: q2
        name: qualifying 2
        description: time in qualifying 2
        data_format: text
        value_description: |-
          in minutes / seconds / ...
          commonsense evidence:
          only top 15 in the q1 has the record of q2
          Q2 is slightly shorter but follows the same format. Drivers try to put down their best times to move on to Q1 as one of the 10 fastest cars. The five outside of the top 10 are eliminated and start the race from 11th to 15th based on their best lap time.
      q3:
        bird_name: q3
        name: qualifying 3
        description: time in qualifying 3
        data_format: text
        value_description: |-
          in minutes / seconds / ...
          commonsense evidence:
          only top 10 in the q2 has the record of q3
