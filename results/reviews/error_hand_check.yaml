    INNER JOIN superpower AS T3 ON T3.id = T2.power_id INNER JOIN gender AS T4 ON T4.id = T1.gender_id
    WHERE T4.gender = 'Male' LIMIT 5
  outcome: ok
  relation: disjoint
  hand_category: order_limit
  expert_questionable: false
