# Ruff from the project's own locked environment, so the hook, CI and the editor all run the
# same version (a pinned hook repository drifts from uv.lock).
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
