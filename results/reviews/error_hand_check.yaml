- question_id: 484
  db_id: card_games
  question: Please list the Italian names of the cards in the set Coldsnap with the highest converted
    mana cost.
  hint: card set Coldsnap refers to name = 'Coldsnap'; Italian refers to language = 'Italian'; highest
    converted mana cost refers to MAX(convertedManaCost)
  answer_sql: "WITH coldsnap AS (\n  SELECT c.uuid, c.convertedmanacost\n  FROM cards c\n  JOIN sets s\
    \ ON c.setcode = s.code\n  WHERE s.name = 'Coldsnap'\n)\nSELECT fd.name\nFROM foreign_data fd\nJOIN\
    \ coldsnap c ON fd.uuid = c.uuid\nWHERE fd.language = 'Italian'\nAND c.convertedmanacost = (SELECT\
    \ MAX(convertedmanacost) FROM coldsnap);"
  expert_sql: SELECT T2.name FROM foreign_data AS T1 INNER JOIN cards AS T2 ON T2.uuid = T1.uuid INNER
    JOIN sets AS T3 ON T3.code = T2.setCode WHERE T3.name = 'Coldsnap' AND T1.language = 'Italian' ORDER
    BY T2.convertedManaCost DESC NULLS LAST
  outcome: ok
  relation: overlap
  hand_category: filter
  expert_questionable: true
  note: Keeps only the cards with the highest converted mana cost, as asked; the expert orders by it without
    keeping the highest, and returns the English names.
- question_id: 530
  db_id: card_games
  question: List all the frame styles and cards Allen Williams worked on and find any banned cards if
    there are any.
  hint: frame styles refers to frameVersion; cards Allen Williams worked on refers to artist = 'Allen
    Williams'; banned cards refers to status = 'Banned'
  answer_sql: 'SELECT c.frameversion, c.name AS card_name, l.status

    FROM cards c

    LEFT JOIN legalities l ON c.uuid = l.uuid AND l.status = ''Banned''

    WHERE c.artist = ''Allen Williams''

    ORDER BY c.frameversion, c.name;'
  expert_sql: SELECT DISTINCT T1.frameVersion, T1.name, CASE WHEN T2.status = 'Banned' THEN T1.name ELSE
    'NO' END FROM cards AS T1 INNER JOIN legalities AS T2 ON T1.uuid = T2.uuid WHERE T1.artist = 'Allen
    Williams'
  outcome: ok
  relation: disjoint
  hand_category: output
  expert_questionable: false
  note: A status column (Banned or empty) per card; the expert returns the card name or 'NO'. The question
    allows both readings; the rows differ in shape and content.
