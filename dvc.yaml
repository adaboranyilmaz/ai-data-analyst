# The data pipeline: fetch the pinned benchmark files, load the database and execute the gold
# SQL, snapshot the schemas, convert BIRD's descriptions into dictionaries, and summarize;
# then harden the databases, run the security suite and check the agent's tools; then check the
# project's scoring against BIRD's official evaluator, split the questions into fixed sets, and
# execute the hand-written banking set.
# `dvc repro` rebuilds it from data/minidev.zip (`dvc pull`) with the compose PostgreSQL up.
# Results files are committed to git (cache: false); data outputs go to the DVC cache.
stages:
  # The BIRD package, pinned by URL and hash. A stage rather than a .dvc file under data/:
  # DVC does not look for .dvc files inside a directory that .gitignore covers with `data/*`.
  # persist: an existing package that still matches its hash is kept, not downloaded again.
  download:
    cmd: uv run python scripts/10_fetch_bird.py --download-only
    params:
      - configs/datasets.yaml:
          - bird_minidev.package
    outs:
      - data/minidev.zip:
          persist: true

  fetch:
    cmd: uv run python scripts/10_fetch_bird.py
    deps:
      - scripts/10_fetch_bird.py
      - src/data/bird.py
      - configs/datasets.yaml
      - data/minidev.zip
    outs:
      - data/raw/bird_minidev
      - results/metrics/bird_sources.json:
          cache: false

  # One stage, because the database is state outside DVC: the gold SQL runs once on the
  # dump's own layout and again after the tables move into per-database schemas, and the
  # second run is compared with the first.
  database:
    cmd:
      - uv run python scripts/11_load_bird.py load
      - uv run python scripts/12_run_gold.py --layout public
      - uv run python scripts/11_load_bird.py split
      - uv run python scripts/12_run_gold.py --layout schemas
    deps:
      - scripts/11_load_bird.py
      - scripts/12_run_gold.py
      - src/data/bird.py
      - src/db/connection.py
      - src/db/values.py
      - configs/datasets.yaml
      - configs/gold_exclusions.yaml
      - docker/postgres/init/01_roles.sh
      - data/minidev.zip
      - data/raw/bird_minidev
    outs:
      - data/gold
      - results/metrics/bird_load.json:
          cache: false
      - results/metrics/gold_execution_public.json:
          cache: false
      - results/metrics/gold_execution.json:
          cache: false

  snapshot:
    cmd: uv run python scripts/13_snapshot_schema.py
    deps:
      - scripts/13_snapshot_schema.py
      - src/dictionary/snapshot.py
      - results/metrics/bird_load.json
    outs:
      - dictionary/_snapshot:
          cache: false

  dictionaries:
    cmd: uv run python scripts/14_convert_descriptions.py
    deps:
      - scripts/14_convert_descriptions.py
      - src/dictionary/model.py
      - data/raw/bird_minidev
      - dictionary/_snapshot
    outs:
      - dictionary/california_schools.yaml:
          cache: false
      - dictionary/card_games.yaml:
          cache: false
      - dictionary/codebase_community.yaml:
          cache: false
      - dictionary/debit_card_specializing.yaml:
          cache: false
      - dictionary/european_football_2.yaml:
          cache: false
      - dictionary/formula_1.yaml:
          cache: false
      - dictionary/student_club.yaml:
          cache: false
      - dictionary/superhero.yaml:
          cache: false
      - dictionary/thrombosis_prediction.yaml:
          cache: false
      - dictionary/toxicology.yaml:
          cache: false

  data_stats:
    cmd: uv run python scripts/15_data_stats.py
    deps:
      - scripts/15_data_stats.py
      - src/dictionary/model.py
      - dictionary
      - results/metrics/bird_sources.json
      - results/metrics/bird_load.json
      - results/metrics/gold_execution.json
    outs:
      - results/metrics/data_stats.json:
          cache: false

  # Hardening lives in the databases' catalogs, outside DVC; its record is the audit. It
  # reruns after a reload of the benchmark (bird_load.json), which recreates the `bird`
  # database and its tables.
  harden:
    cmd: uv run python scripts/20_harden_db.py
    deps:
      - scripts/20_harden_db.py
      - src/db/hardening.py
      - src/db/hardening.sql
      - src/db/security_fixtures.sql
      - src/db/connection.py
      - dictionary/_snapshot
      - results/metrics/bird_load.json
    outs:
      - results/metrics/db_hardening.json:
          cache: false

  security:
    cmd: uv run python scripts/21_security_suite.py --require-bird
    deps:
      - scripts/21_security_suite.py
      - src/db/security_suite.py
      - src/db/guard.py
      - src/db/execute.py
      - src/db/hardening.py
      - src/tools/sql.py
      - configs/security_attacks.yaml
      - results/metrics/db_hardening.json
    outs:
      - results/metrics/security_suite.json:
          cache: false

  tool_check:
    cmd: uv run python scripts/22_tool_check.py
    deps:
      - scripts/22_tool_check.py
      - src/db/guard.py
      - src/db/execute.py
      - src/db/hardening.py
      - src/tools/sql.py
      - src/tools/schema.py
      - src/tools/chart.py
      - src/tools/definitions.py
      - src/tools/toolbox.py
      - src/tools/schemas/vega-lite-v6.4.3.schema.json.gz
      - configs/tools.yaml
      - configs/datasets.yaml
      - dictionary
      - data/raw/bird_minidev
      - results/metrics/gold_execution.json
      - results/metrics/db_hardening.json
    outs:
      - results/metrics/tool_check.json:
          cache: false

  # BIRD's official evaluator at its pinned commit, each file checked against its hash. Only
  # ex_validation runs it; it is not committed (the upstream repository has no license file).
  bird_eval:
    cmd: uv run python scripts/30_fetch_bird_eval.py
    deps:
      - scripts/30_fetch_bird_eval.py
    params:
      - configs/eval.yaml:
          - official_evaluator.commit
          - official_evaluator.url
          - official_evaluator.sha256
    outs:
      - data/raw/bird_eval

  # The project's scoring against the official evaluator's, case by case: the gold queries,
  # altered gold queries and hand-written edge cases. Needs the `bird-eval` dependency group.
  ex_validation:
    cmd: uv run --group bird-eval python scripts/31_validate_ex.py
    deps:
      - scripts/31_validate_ex.py
      - src/eval/ex.py
      - src/eval/execution.py
      - src/eval/official.py
      - src/eval/mutations.py
      - src/db/execute.py
      - src/db/values.py
      - configs/ex_edge_cases.yaml
      - data/raw/bird_eval
      - data/raw/bird_minidev
      - results/metrics/gold_execution.json
      - results/metrics/db_hardening.json
    params:
      - configs/eval.yaml:
          - official_evaluator
          - execution_accuracy
    outs:
      - data/eval_validation
      - results/metrics/ex_validation.json:
          cache: false

  # The pilot, ablation and held-out question sets, fixed before any agent runs.
  splits:
    cmd: uv run python scripts/32_splits.py
    deps:
      - scripts/32_splits.py
      - src/eval/splits.py
      - data/raw/bird_minidev
    params:
      - configs/eval.yaml:
          - splits
    outs:
      - results/metrics/splits.json:
          cache: false

  # Every query of the hand-written banking set through the guard and the agent's execution
  # path; fails if one is refused, fails, returns nothing, or repeats the benchmark.
  own_set_gold:
    cmd: uv run python scripts/33_own_set_gold.py
    deps:
      - scripts/33_own_set_gold.py
      - src/eval/own_set.py
      - own_set/questions.yaml
      - src/db/guard.py
      - src/db/execute.py
      - results/metrics/gold_execution.json
      - results/metrics/db_hardening.json
    outs:
      - data/own_set
      - results/metrics/own_set_gold.json:
          cache: false

  # The agent's runs, stage by stage (configs/agent.yaml `stages`). Each stage's model responses
  # are an output kept between runs (persist): with them in place a rebuild replays every answer
  # at no cost (ANALYST_REPLAY_ONLY=1 makes a missing response an error, never a call). Traces
  # and spans are data; the per-question records are committed.
  agent_pilot:
    cmd: uv run python scripts/42_run_stage.py --stage pilot
    deps: &agent_deps
      - scripts/42_run_stage.py
      - src/agent/answer.py
      - src/agent/clock.py
      - src/agent/conversation.py
      - src/agent/driver.py
      - src/agent/evaluate.py
      - src/agent/run.py
      - src/agent/stages.py
      - src/agent/steps.py
      - src/agent/tools.py
      - src/agent/verify.py
      - src/llm/backends.py
      - src/llm/batch.py
      - src/llm/cache.py
      - src/llm/generate.py
      - src/llm/ledger.py
      - src/llm/types.py
      - src/tools/chart.py
      - src/tools/definitions.py
      - src/tools/schema.py
      - src/tools/sql.py
      - src/tools/toolbox.py
      - src/db/guard.py
      - src/db/execute.py
      - src/eval/ex.py
      - src/eval/execution.py
      - src/eval/own_set.py
      - src/eval/records.py
      - src/tracking/otel.py
      - prompts/single_shot_v3.md
      - prompts/agent_v3.md
      - prompts/narrow_v1.md
      - configs/tools.yaml
      - dictionary
      - data/raw/bird_minidev
      - results/metrics/splits.json
      - results/metrics/gold_execution.json
      - results/metrics/db_hardening.json
    params:
      - configs/agent.yaml:
          - prompts
          - models
          - designs
          - reminders
          - max_model_calls
          - presentation
          - checks
          - stages.pilot
      - configs/budget.yaml:
          - prices_usd_per_mtok
          - batch_discount
      - configs/eval.yaml:
          - execution_accuracy
    outs:
      - data/cache/llm_pilot:
          persist: true
      - data/traces/pilot
      - data/spans/pilot
      - results/runs/pilot:
          cache: false

  agent_ablation:
    cmd: uv run python scripts/42_run_stage.py --stage ablation
    deps: *agent_deps
    params:
      - configs/agent.yaml:
          - prompts
          - models
          - designs
          - reminders
          - max_model_calls
          - presentation
          - checks
          - stages.ablation
      - configs/budget.yaml:
          - prices_usd_per_mtok
          - batch_discount
      - configs/eval.yaml:
          - execution_accuracy
    outs:
      - data/cache/llm_ablation:
          persist: true
      - data/traces/ablation
      - data/spans/ablation
      - results/runs/ablation:
          cache: false

  # The design comparison: every run summarized and compared, the winner chosen by the
  # pre-registered rule (refuses to run if the pre-registration changed).
  ablation_report:
    cmd: uv run python scripts/43_ablation_report.py
    deps:
      - scripts/43_ablation_report.py
      - src/eval/reports.py
      - src/eval/summary.py
      - src/eval/selective.py
      - src/eval/calibration.py
      - src/eval/bootstrap.py
      - src/eval/records.py
      - src/eval/preregistration.py
      - results/metrics/preregistration.md
      - results/runs/ablation
    params:
      - configs/eval.yaml:
          - bootstrap
          - calibration
          - selective
          - preregistration
      - configs/agent.yaml:
          - stages.ablation
    outs:
      - results/metrics/ablation.json:
          cache: false

  # The winning design's runs (its design read from ablation.json): all 500 questions, the
  # ablation set without evidence, Claude Haiku 4.5; then the hand-written banking set. Each
  # reads the responses of the stages before it.
  agent_main:
    cmd: uv run python scripts/42_run_stage.py --stage main
    # the agent's deps (above), the banking set (frozen; for agent_own), the winner, and the
    # ablation's responses (read by both stages)
    deps: &winner_deps
      - scripts/42_run_stage.py
      - src/agent/answer.py
      - src/agent/clock.py
      - src/agent/conversation.py
      - src/agent/driver.py
      - src/agent/evaluate.py
      - src/agent/run.py
      - src/agent/stages.py
      - src/agent/steps.py
      - src/agent/tools.py
      - src/agent/verify.py
      - src/llm/backends.py
      - src/llm/batch.py
      - src/llm/cache.py
      - src/llm/generate.py
      - src/llm/ledger.py
      - src/llm/types.py
      - src/tools/chart.py
      - src/tools/definitions.py
      - src/tools/schema.py
      - src/tools/sql.py
      - src/tools/toolbox.py
      - src/db/guard.py
      - src/db/execute.py
      - src/eval/ex.py
      - src/eval/execution.py
      - src/eval/own_set.py
      - src/eval/records.py
      - src/tracking/otel.py
      - prompts/single_shot_v3.md
      - prompts/agent_v3.md
      - prompts/narrow_v1.md
      - configs/tools.yaml
      - dictionary
      - data/raw/bird_minidev
      - results/metrics/splits.json
      - results/metrics/gold_execution.json
      - results/metrics/db_hardening.json
      - own_set/questions.yaml
      - results/metrics/ablation.json
      - data/cache/llm_ablation
    params:
      - configs/agent.yaml:
          - prompts
          - models
          - designs
          - reminders
          - max_model_calls
          - presentation
          - checks
          - stages.ablation
          - stages.main
      - configs/budget.yaml:
          - prices_usd_per_mtok
          - batch_discount
      - configs/eval.yaml:
          - execution_accuracy
    outs:
      - data/cache/llm_main:
          persist: true
      - data/traces/main
      - data/spans/main
      - results/runs/main:
          cache: false

  agent_own:
    cmd: uv run python scripts/42_run_stage.py --stage own
    deps: *winner_deps
    params:
      - configs/agent.yaml:
          - prompts
          - models
          - designs
          - reminders
          - max_model_calls
          - presentation
          - checks
          - stages.ablation
          - stages.own
      - configs/budget.yaml:
          - prices_usd_per_mtok
          - batch_discount
      - configs/eval.yaml:
          - execution_accuracy
    outs:
      - data/cache/llm_own:
          persist: true
      - data/traces/own
      - data/spans/own
      - results/runs/own:
          cache: false

  # The winner on the benchmark (all 500, held-out, evidence, Claude Haiku 4.5), then on the
  # banking set; both refuse to run if the pre-registration changed.
  main_report:
    cmd: uv run python scripts/45_main_report.py
    deps:
      - scripts/45_main_report.py
      - src/agent/stages.py
      - src/eval/reports.py
      - src/eval/summary.py
      - src/eval/selective.py
      - src/eval/calibration.py
      - src/eval/bootstrap.py
      - src/eval/records.py
      - src/eval/preregistration.py
      - results/metrics/preregistration.md
      - results/metrics/splits.json
      - results/metrics/ablation.json
      - results/runs/ablation
      - results/runs/main
    params:
      - configs/eval.yaml:
          - bootstrap
          - calibration
          - selective
          - preregistration
      - configs/agent.yaml:
          - stages.main
    outs:
      - results/metrics/benchmark_main.json:
          cache: false

  own_set_report:
    cmd: uv run python scripts/46_own_set_report.py
    deps:
      - scripts/46_own_set_report.py
      - src/agent/stages.py
      - src/eval/own_review.py
      - src/eval/own_set.py
      - own_set/questions.yaml
      - src/eval/reports.py
      - src/eval/summary.py
      - src/eval/selective.py
      - src/eval/calibration.py
      - src/eval/bootstrap.py
      - src/eval/records.py
      - src/eval/preregistration.py
      - results/metrics/preregistration.md
      - results/metrics/ablation.json
      - results/metrics/benchmark_main.json
      - results/runs/own
      - results/reviews/own_set_review.yaml
    params:
      - configs/eval.yaml:
          - bootstrap
          - calibration
          - selective
          - preregistration
    outs:
      - results/metrics/own_set.json:
          cache: false

  # Confidence, calibration and escalation (configs/confidence.yaml). The critic reviews the
  # winner's answers; the escalation arm runs the winner on Claude Opus 5.5. Like the agent's
  # stages, each keeps its model responses between runs (persist), so a rebuild with
  # ANALYST_REPLAY_ONLY=1 replays every call at no cost.
  critic:
    cmd: uv run python scripts/51_run_critic.py
    deps:
      - scripts/51_run_critic.py
      - src/agent/answer.py
      - src/agent/clock.py
      - src/agent/confidence.py
      - src/agent/conversation.py
      - src/agent/critic.py
      - src/agent/driver.py
      - src/agent/evaluate.py
      - src/agent/run.py
      - src/agent/steps.py
      - src/agent/tools.py
      - src/agent/verify.py
      - src/data/bird.py
      - src/db/connection.py
      - src/db/execute.py
      - src/db/guard.py
      - src/db/hardening.py
      - src/db/values.py
      - src/dictionary/model.py
      - src/dictionary/snapshot.py
      - src/eval/config.py
      - src/eval/ex.py
      - src/eval/execution.py
      - src/eval/own_set.py
      - src/eval/records.py
      - src/llm/backends.py
      - src/llm/batch.py
      - src/llm/cache.py
      - src/llm/generate.py
      - src/llm/ledger.py
      - src/llm/types.py
      - src/tools/chart.py
      - src/tools/definitions.py
      - src/tools/schema.py
      - src/tools/sql.py
      - src/tools/toolbox.py
      - src/tracking/otel.py
      - prompts/critic_v1.md
      - configs/tools.yaml
      - dictionary
      - data/raw/bird_minidev
      - results/metrics/splits.json
      - results/metrics/db_hardening.json
      - results/metrics/ablation.json
      - results/runs/main
    params:
      - configs/confidence.yaml:
          - answers
          - phase
          - critic
      - configs/agent.yaml:
          - presentation
          - checks
      - configs/budget.yaml:
          - prices_usd_per_mtok
          - batch_discount
    outs:
      - data/cache/llm_critic:
          persist: true
      - data/traces/critic
      - data/spans/critic
      - results/runs/critic:
          cache: false

  agent_escalation:
    cmd: uv run python scripts/52_run_escalation.py
    deps:
      - scripts/52_run_escalation.py
      - src/agent/answer.py
      - src/agent/clock.py
      - src/agent/confidence.py
      - src/agent/conversation.py
      - src/agent/driver.py
      - src/agent/escalation.py
      - src/agent/evaluate.py
      - src/agent/run.py
      - src/agent/stages.py
      - src/agent/steps.py
      - src/agent/tools.py
      - src/agent/verify.py
      - src/data/bird.py
      - src/db/connection.py
      - src/db/execute.py
      - src/db/guard.py
      - src/db/hardening.py
      - src/db/values.py
      - src/dictionary/model.py
      - src/dictionary/snapshot.py
      - src/eval/config.py
      - src/eval/ex.py
      - src/eval/execution.py
      - src/eval/own_set.py
      - src/eval/records.py
      - src/llm/backends.py
      - src/llm/batch.py
      - src/llm/cache.py
      - src/llm/generate.py
      - src/llm/ledger.py
      - src/llm/types.py
      - src/tools/chart.py
      - src/tools/definitions.py
      - src/tools/schema.py
      - src/tools/sql.py
      - src/tools/toolbox.py
      - src/tracking/otel.py
      - prompts/single_shot_v3.md
      - configs/tools.yaml
      - dictionary
      - data/raw/bird_minidev
      - results/metrics/splits.json
      - results/metrics/gold_execution.json
      - results/metrics/db_hardening.json
      - results/metrics/ablation.json
    params:
      - configs/confidence.yaml:
          - phase
          - escalation
      - configs/agent.yaml:
          - prompts
          - models
          - designs
          - reminders
          - max_model_calls
          - presentation
          - checks
      - configs/budget.yaml:
          - prices_usd_per_mtok
          - batch_discount
      - configs/eval.yaml:
          - execution_accuracy
    outs:
      - data/cache/llm_escalation:
          persist: true
      - data/traces/escalation
      - data/spans/escalation
      - results/runs/escalation:
          cache: false

  # Calibration and the decline threshold (fitted and chosen on the calibration split, reported
  # on the held-out set), the critic's comparison, and the escalation decision; both refuse to
  # run if the pre-registration changed.
  confidence_report:
    cmd: uv run python scripts/53_confidence_report.py
    deps:
      - scripts/53_confidence_report.py
      - src/agent/confidence.py
      - src/data/bird.py
      - src/eval/bootstrap.py
      - src/eval/calibrate.py
      - src/eval/calibration.py
      - src/eval/config.py
      - src/eval/preregistration.py
      - src/eval/records.py
      - src/eval/reports.py
      - src/eval/selective.py
      - src/eval/summary.py
      - results/metrics/preregistration.md
      - results/metrics/splits.json
      - results/metrics/ablation.json
      - results/runs/main
      - results/runs/critic
    params:
      - configs/confidence.yaml:
          - answers
          - critic
          - decline
          - combined
      - configs/eval.yaml:
          - bootstrap
          - calibration
          - selective
          - preregistration
    outs:
      - results/metrics/calibration.json:
          cache: false
      - results/metrics/risk_coverage.json:
          cache: false

  escalation_report:
    cmd: uv run python scripts/54_escalation_report.py
    deps:
      - scripts/54_escalation_report.py
      - src/agent/confidence.py
      - src/data/bird.py
      - src/eval/bootstrap.py
      - src/eval/calibration.py
      - src/eval/config.py
      - src/eval/preregistration.py
      - src/eval/records.py
      - src/eval/reports.py
      - src/eval/selective.py
      - src/eval/summary.py
      - results/metrics/preregistration.md
      - results/metrics/ablation.json
      - results/runs/ablation
      - results/runs/escalation
    params:
      - configs/confidence.yaml:
          - escalation
      - configs/eval.yaml:
          - bootstrap
          - calibration
          - selective
          - preregistration
    outs:
      - results/metrics/escalation.json:
          cache: false

  # The router, run only when the escalation model was adopted: the escalation model on the
  # held-out set; the routing (below the decline threshold) is applied in its report.
  router:
    cmd: uv run python scripts/59_run_router.py
    deps:
      - scripts/59_run_router.py
      - src/agent/answer.py
      - src/agent/clock.py
      - src/agent/confidence.py
      - src/agent/conversation.py
      - src/agent/driver.py
      - src/agent/escalation.py
      - src/agent/evaluate.py
      - src/agent/run.py
      - src/agent/stages.py
      - src/agent/steps.py
      - src/agent/tools.py
      - src/agent/verify.py
      - src/data/bird.py
      - src/db/connection.py
      - src/db/execute.py
      - src/db/guard.py
      - src/db/hardening.py
      - src/db/values.py
      - src/dictionary/model.py
      - src/dictionary/snapshot.py
      - src/eval/config.py
      - src/eval/ex.py
      - src/eval/execution.py
      - src/eval/own_set.py
      - src/eval/records.py
      - src/llm/backends.py
