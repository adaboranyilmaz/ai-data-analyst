  question: Are there more in-patient or outpatient who were male? What is the deviation in percentage?
  hint: male refers to SEX = 'M'; in-patient refers to Admission = '+'; outpatient refers to Admission
    = '-'; percentage = DIVIDE(COUNT(ID) where SEX = 'M' and Admission = '+', COUNT(ID) where SEX  = 'M'
    and Admission = '-')
  answer_sql: "WITH counts AS (\n  SELECT\n    COUNT(*) FILTER (WHERE sex = 'M' AND admission = '+') AS\
    \ in_patient_male,\n    COUNT(*) FILTER (WHERE sex = 'M' AND admission = '-') AS outpatient_male\n\
    \  FROM patient\n)\nSELECT\n  in_patient_male,\n  outpatient_male,\n  CAST(in_patient_male AS REAL)\
    \ * 100 / NULLIF(outpatient_male, 0) AS percentage\nFROM counts;"
  expert_sql: SELECT CAST(SUM(CASE WHEN Admission = '+' THEN 1 ELSE 0 END) AS REAL) * 100 / NULLIF(SUM(CASE
    WHEN Admission = '-' THEN 1 ELSE 0 END), 0) FROM Patient WHERE SEX = 'M'
  outcome: ok
