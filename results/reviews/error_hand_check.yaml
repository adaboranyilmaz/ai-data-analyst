- question_id: 1241
  db_id: thrombosis_prediction
  question: For patients with abnormal platelet level, state the number of patients with lower than normal
    range. How is it compare to the number of patients with higher than normal range?
  hint: abnormal platelet level refers to PLT <= 100 or PLT >= 400; platelet level lower than normal range
    refers to PLT < 100; calculation = SUBTRACT(SUM(PLT < 100), SUM(PLT > 400)); platelet level higher
    than normal range refers to PLT > 400;
  answer_sql: "WITH plt_data AS (\n  SELECT DISTINCT id, plt FROM laboratory WHERE plt IS NOT NULL\n)\n\
    SELECT\n  COUNT(DISTINCT CASE WHEN plt < 100 THEN id END) AS lower_count,\n  COUNT(DISTINCT CASE WHEN\
    \ plt > 400 THEN id END) AS higher_count,\n  COUNT(DISTINCT CASE WHEN plt < 100 THEN id END) - COUNT(DISTINCT\
    \ CASE WHEN plt > 400 THEN id END) AS difference\nFROM plt_data;"
  expert_sql: SELECT SUM(CASE WHEN T2.PLT <= 100 THEN 1 ELSE 0 END) - SUM(CASE WHEN T2.PLT >= 400 THEN
    1 ELSE 0 END) FROM Patient AS T1 INNER JOIN Laboratory AS T2 ON T1.ID = T2.ID
  outcome: ok
  relation: same_row_count
  hand_category: computation
  expert_questionable: true
  note: Counts distinct patients with PLT < 100 and > 400, as the hint says; the expert counts laboratory
    rows with <= 100 and >= 400, against its own hint.
