    T2.hero_id INNER JOIN attribute AS T3 ON T3.id = T2.attribute_id INNER JOIN publisher AS T4 ON T4.id
    = T1.publisher_id WHERE T4.publisher_name = 'Dark Horse Comics' AND T3.attribute_name = 'Durability'
    ORDER BY T2.attribute_value DESC NULLS LAST LIMIT 1
  outcome: ok
  relation: empty
  hand_category: filter
  expert_questionable: false
