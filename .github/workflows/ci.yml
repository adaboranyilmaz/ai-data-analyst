# Lint, unit tests, the database-role tests and the security suite against the compose
# PostgreSQL, DVC status and the README check, on every pull request and on main. No step can
# call a model API: there is no key, and replay-only mode turns any cache miss into an error.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.3"
  PYTHONUTF8: "1"
  ANALYST_REPLAY_ONLY: "1"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install (locked, with the LangGraph arm's group so its tests run)
        run: uv sync --frozen --group langgraph
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Start PostgreSQL
        run: docker compose up -d --wait postgres
      - name: Harden the database (closed system functions and views, schema roles)
        run: uv run python scripts/20_harden_db.py --no-results
      - name: Tests (the database tests may not skip)
        env:
          ANALYST_REQUIRE_DB: "1"
        run: uv run pytest -q -rs
      - name: Evaluation gate (recorded model calls replayed, the registry checked)
        run: |
          uv run python scripts/86_registry.py check
          uv run python scripts/89_eval_gate.py
      - name: Alert rules (promtool unit tests) and the compose file
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/monitoring:/m:ro" prom/prometheus:latest@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e check rules /m/alerts.yml
          docker run --rm --entrypoint promtool -v "$PWD/monitoring:/m:ro" prom/prometheus:latest@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e test rules /m/tests/alerts_test.yml
          docker compose --profile tracing --profile monitoring config --quiet
      - name: DVC status
        run: uv run dvc status
      - name: README and report match the results files
        run: uv run python scripts/90_readme.py --check

  # The statistics sandbox: its image built from the lock file's pinned packages, then the tests
  # of its analyses and its security suite (every attack blocked, every control effective).
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install (locked)
        run: uv sync --frozen
      - name: The sandbox's requirements match the lock file
        run: uv run python scripts/70_build_sandbox.py --check
      - name: Build the sandbox image
        run: uv run python scripts/70_build_sandbox.py
      - name: Sandbox tests and security suite (they may not skip)
        env:
          ANALYST_REQUIRE_SANDBOX: "1"
        run: uv run pytest -q -rs -m sandbox

  # The UI: types, unit tests and the production build.
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build

  # End to end, in a real browser: the built UI served by the API in replay mode (no key, no
  # database). Ask, stream, evidence visible, permalink.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: uv sync --frozen
      - name: Build the UI
        working-directory: ui
        run: |
          npm ci
          npm run build
      - name: Install the browser
        working-directory: ui
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        working-directory: ui
        run: npx playwright test
      - name: The static demo, served from a path with no API behind it
        run: |
          (cd ui && npm run build:static)
          uv run python scripts/95_static_site.py
          (cd ui && npm run e2e:static)
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: ui/test-results

  # The cloud deployment's Terraform is formatted and valid (no cloud call: no credentials, no state).
  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Format and validate
        run: |
          docker run --rm --entrypoint sh -v "$PWD/infra:/w" -w /w hashicorp/terraform:1.9@sha256:18f9986038bbaf02cf49db9c09261c778161c51dcc7fb7e355ae8938459428cd             -c "terraform fmt -check -diff && terraform init -backend=false -input=false && terraform validate"

  # The service image builds, starts, and serves a recorded run.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t analyst-api:ci .
      - name: Start and ask
        run: |
          docker run -d --name api -p 8000:8000 analyst-api:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/ready
          curl -sf -X POST http://127.0.0.1:8000/ask -H 'content-type: application/json' \
            -d '{"run_id":"bench-782"}' | grep -q '"type": "done"'
