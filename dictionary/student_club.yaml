# Data dictionary: the BIRD `student_club` database, converted by scripts/14_convert_descriptions.py
# from BIRD's database description files, without editing their text. Regenerate; do not
# edit by hand. Derived from BIRD (Li et al., 2023), licensed CC BY-SA 4.0.
database: student_club
origin: bird-description
name: student_club
sources:
- BIRD mini-dev database description files (CC BY-SA 4.0)
tables:
  attendance:
    bird_file: Attendance.csv
    columns:
      link_to_event:
        bird_name: link_to_event
        name: link to event
        description: The unique identifier of the event which was attended
        data_format: text
        value_description: References the Event table
      link_to_member:
        bird_name: link_to_member
        name: link to member
        description: The unique identifier of the member who attended the event
        data_format: text
        value_description: References the Member table
  budget:
    bird_file: Budget.csv
    columns:
      budget_id:
        bird_name: budget_id
        name: budget id
        description: A unique identifier for the budget entry
        data_format: text
      category:
        bird_name: category
        name: category
        description: The area for which the amount is budgeted, such as, advertisement, food, parking
        data_format: text
      spent:
        bird_name: spent
        name: spent
        description: The total amount spent in the budgeted category for an event.
        data_format: real
        value_description: the unit is dollar. This is summarized from the Expense table
      remaining:
        bird_name: remaining
        name: remaining
        description: A value calculated as the amount budgeted minus the amount spent
        data_format: real
        value_description: |-
          the unit is dollar
          commonsense evidence: If the remaining < 0, it means that the cost has exceeded the budget.
      amount:
        bird_name: amount
        name: amount
        description: The amount budgeted for the specified category and event
        data_format: integer
        value_description: |-
          the unit is dollar
          commonsense evidence:
          some computation like: amount = spent + remaining
      event_status:
        bird_name: event_status
        name: event status
        description: the status of the event
        data_format: text
        value_description: |-
          Closed / Open/ Planning
          commonsense evidence:
          • Closed: It means that the event is closed. The spent and the remaining won't change anymore.
          • Open: It means that the event is already opened. The spent and the remaining will change with new expenses.
          • Planning: The event is not started yet but is planning. The spent and the remaining won't change at this stage.
      link_to_event:
        bird_name: link_to_event
        name: link to event
        description: The unique identifier of the event to which the budget line applies.
        data_format: text
        value_description: References the Event table
  event:
    bird_file: Event.csv
    columns:
      event_id:
        bird_name: event_id
        name: event id
        description: A unique identifier for the event
        data_format: text
      event_name:
        bird_name: event_name
        name: event name
        description: event name
        data_format: text
      event_date:
        bird_name: event_date
        name: event date
        description: The date the event took place or is scheduled to take place
        data_format: text
        value_description: e.g. 2020-03-10T12:00:00
      type:
        bird_name: type
        name: type
        description: The kind of event, such as game, social, election
        data_format: text
      notes:
        bird_name: notes
        name: notes
        description: A free text field for any notes about the event
        data_format: text
      location:
        bird_name: location
        name: location
        description: Address where the event was held or is to be held or the name of such a location
        data_format: text
      status:
        bird_name: status
        name: status
        description: One of three values indicating if the event is in planning, is opened, or is closed
        data_format: text
        value_description: Open/ Closed/ Planning
  expense:
    bird_file: Expense.csv
    columns:
      expense_id:
        bird_name: expense_id
        name: expense id
        description: unique id of income
        data_format: text
      expense_description:
        bird_name: expense_description
        name: expense description
        description: A textual description of what the money was spend for
        data_format: text
      expense_date:
        bird_name: expense_date
        name: expense date
        description: The date the expense was incurred
        data_format: text
        value_description: e.g. YYYY-MM-DD
      cost:
        bird_name: cost
        name: cost
        description: The dollar amount of the expense
        data_format: real
        value_description: the unit is dollar
      approved:
        bird_name: approved
        name: approved
        description: A true or false value indicating if the expense was approved
        data_format: text
        value_description: true/ false
      link_to_member:
        bird_name: link_to_member
        name: link to member
        description: The member who incurred the expense
        data_format: text
      link_to_budget:
        bird_name: link_to_budget
        name: link to budget
        description: The unique identifier of the record in the Budget table that indicates the expected
          total expenditure for a given category and event.
        data_format: text
        value_description: References the Budget table
  income:
    bird_file: Income.csv
    columns:
      income_id:
        bird_name: income_id
        name: income id
        description: A unique identifier for each record of income
        data_format: text
      date_received:
        bird_name: date_received
        name: date received
        description: the date that the fund received
        data_format: text
      amount:
        bird_name: amount
        name: amount
        description: amount of funds
        data_format: integer
        value_description: the unit is dollar
      source:
        bird_name: source
        name: source
        description: A value indicating where the funds come from such as dues, or the annual university
          allocation
        data_format: text
      notes:
        bird_name: notes
        name: notes
        description: A free-text value giving any needed details about the receipt of funds
        data_format: text
      link_to_member:
        bird_name: link_to_member
        name: link to member
        description: link to member
        data_format: text
  major:
    bird_file: Major.csv
    columns:
      major_id:
        bird_name: major_id
        name: major id
        description: A unique identifier for each major
        data_format: text
      major_name:
        bird_name: major_name
        name: major name
        description: major name
        data_format: text
      department:
        bird_name: department
        name: department
        description: The name of the department that offers the major
        data_format: text
      college:
        bird_name: college
        name: college
        description: The name college that houses the department that offers the major
        data_format: text
  member:
    bird_file: Member.csv
    columns:
      member_id:
        bird_name: member_id
        name: member id
        description: unique id of member
        data_format: text
      first_name:
        bird_name: first_name
        name: first name
        description: member's first name
        data_format: text
      last_name:
        bird_name: last_name
        name: last name
        description: member's last name
        data_format: text
        value_description: |-
          commonsense evidence:
          full name is first_name + last_name. e.g. A member's first name is Angela and last name is Sanders. Thus, his/her full name is Angela Sanders.
      email:
        bird_name: email
        name: email
        description: member's email
        data_format: text
      position:
        bird_name: position
        name: position
        description: The position the member holds in the club
        data_format: text
      t_shirt_size:
        bird_name: t_shirt_size
        name: t_shirt_size
        description: The size of tee shirt that member wants when shirts are ordered
        data_format: text
        value_description: 'commonsense evidence: usually the student ordered t-shirt with lager size
          has bigger body shape'
      phone:
        bird_name: phone
        name: phone
        description: The best telephone at which to contact the member
        data_format: text
      zip:
        bird_name: zip
        name: zip
        description: the zip code of the member's hometown
        data_format: integer
      link_to_major:
        bird_name: link_to_major
        name: link to major
        description: The unique identifier of the major of the member. References the Major table
        data_format: text
  zip_code:
    bird_file: Zip_Code.csv
    columns:
      zip_code:
        bird_name: zip_code
        name: zip code
        description: The ZIP code itself. A five-digit number identifying a US post office.
        data_format: integer
      type:
        bird_name: type
        name: type
        description: The kind of ZIP code
        data_format: text
        value_description: |-
          commonsense evidence:
          � Standard: the normal codes with which most people are familiar
          � PO Box: zip codes have post office boxes
          � Unique: zip codes that are assigned to individual organizations.
      city:
        bird_name: city
        name: city
        description: The city to which the ZIP pertains
        data_format: text
      county:
        bird_name: county
        name: county
        description: The county to which the ZIP pertains
        data_format: text
      state:
        bird_name: state
        name: state
        description: The name of the state to which the ZIP pertains
        data_format: text
      short_state:
        bird_name: short_state
        name: short state
        description: The abbreviation of the state to which the ZIP pertains
        data_format: text
