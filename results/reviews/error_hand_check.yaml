- question_id: 197
  db_id: toxicology
  question: Calculate the average number of oxygen atoms in single-bonded molecules.
  hint: single-bonded molecules refers to bond_type = '-' ; average number of oxygen atom = AVG(element
    = 'o')
  answer_sql: 'SELECT CAST(SUM(CASE WHEN a.element = ''o'' THEN 1 ELSE 0 END) AS REAL) / COUNT(DISTINCT
    b.molecule_id) AS avg_oxygen_atoms

    FROM bond b

    JOIN atom a ON a.molecule_id = b.molecule_id

    WHERE b.bond_type = ''-'''
  expert_sql: SELECT AVG(oxygen_count) FROM (SELECT T1.molecule_id, COUNT(T1.element) AS oxygen_count
    FROM atom AS T1 INNER JOIN bond AS T2 ON T1.molecule_id = T2.molecule_id WHERE T2.bond_type = '-'
    AND T1.element = 'o' GROUP BY T1.molecule_id) AS oxygen_counts
  outcome: ok
  relation: disjoint
  hand_category: computation
  expert_questionable: false
  note: Divides the oxygen count by all single-bonded molecules; the expert averages over the molecules
    that have oxygen. Both multiply atoms by bonds through the join.
- question_id: 218
  db_id: toxicology
  question: What percentage of carcinogenic-type molecules does not contain fluorine?
  hint: label = '+' mean molecules are carcinogenic; contain fluorine refers to element = 'f'; percentage
    = DIVIDE(SUM(element = 'f') * 100, COUNT(molecule_id)) where label = '+'; Should consider the distinct
    atoms when counting;
  answer_sql: "SELECT CAST(SUM(CASE WHEN m.molecule_id NOT IN (\n    SELECT DISTINCT a.molecule_id FROM\
    \ atom a WHERE a.element = 'f'\n) THEN 1 ELSE 0 END) AS REAL) * 100 / COUNT(m.molecule_id) AS pct_no_fluorine\n\
    FROM molecule m\nWHERE m.label = '+';"
  expert_sql: SELECT CAST(COUNT(DISTINCT CASE WHEN T1.element <> 'f' THEN T2.molecule_id ELSE NULL END)
    AS REAL) * 100 / NULLIF(COUNT(DISTINCT T2.molecule_id), 0) FROM atom AS T1 INNER JOIN molecule AS
    T2 ON T1.molecule_id = T2.molecule_id WHERE T2.label = '+'
  outcome: ok
  relation: disjoint
  hand_category: computation
  expert_questionable: true
  note: The share of carcinogenic molecules with no fluorine atom, as asked; the expert counts molecules
    with any non-fluorine atom, close to all of them.
- question_id: 228
  db_id: toxicology
  question: How much of the hydrogen in molecule TR206 is accounted for? Please provide your answer as
    a percentage with four decimal places.
  hint: hydrogen refers to element = 'h'; TR206 is the molecule id; percentage = DIVIDE(SUM(element =
    'h'), COUNT(atom_id)) as percent where molecule_id = 'TR206'
  answer_sql: 'SELECT CAST(SUM(CASE WHEN element = ''h'' THEN 1 ELSE 0 END) AS REAL) * 100 / COUNT(atom_id)
    AS percentage

    FROM atom

    WHERE molecule_id = ''TR206'';'
  expert_sql: SELECT ROUND(CAST((CAST(COUNT(CASE WHEN T.element = 'h' THEN T.atom_id ELSE NULL END) AS
    REAL) * 100 / NULLIF(COUNT(T.atom_id), 0)) AS NUMERIC), 4) AS percentage FROM atom AS T WHERE T.molecule_id
    = 'TR206'
  outcome: ok
  relation: disjoint
  hand_category: format_only
  expert_questionable: false
  note: The right value, not rounded to four decimal places.
- question_id: 281
  db_id: toxicology
  question: Tally the toxicology element of the 4th atom of each molecule that was carcinogenic.
  hint: 'label = ''+'' means molecules are carcinogenic; 4th atom of each molecule refers to substr(atom_id,
    7, 1) = ''4''; '
  answer_sql: 'SELECT a.element, COUNT(*) AS cnt

    FROM atom a

    JOIN molecule m ON a.molecule_id = m.molecule_id

    WHERE m.label = ''+'' AND substr(a.atom_id, 7, 1) = ''4''

    GROUP BY a.element

    ORDER BY cnt DESC'
  expert_sql: SELECT DISTINCT T1.element FROM atom AS T1 INNER JOIN molecule AS T2 ON T1.molecule_id =
    T2.molecule_id WHERE T2.label = '+' AND RIGHT(T1.atom_id, 1) = '4' AND LENGTH(T1.atom_id) = 7
  outcome: ok
  relation: more_rows
  hand_category: filter
  expert_questionable: false
  note: Follows the hint (seventh character 4, which also matches atoms 40-49); the expert takes ids of
    length 7 ending in 4. The counts beside the elements fit 'tally'.
