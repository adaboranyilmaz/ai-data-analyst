      doc:
        bird_name: DOC
        name: District Ownership Code
        description: District Ownership Code
        data_format: text
        value_description: |-
          The District Ownership Code (DOC) is the numeric code used to identify the category of the Administrative Authority.
          •       00 - County Office of Education
          •       02 – State Board of Education
          •       03 – Statewide Benefit Charter
          •       31 – State Special Schools
          •       34 – Non-school Location*
          •       52 – Elementary School District
          •       54 – Unified School District
          •       56 – High School District
          •       98 – Regional Occupational Center/Program (ROC/P)
          commonsense evidence:
          *Only the California Education Authority has been included in the non-school location category.
      doctype:
        bird_name: DOCType
        name: The District Ownership Code Type
        description: The District Ownership Code Type is the text description of the DOC category.
        data_format: text
        value_description: (See text values in DOC field description above)
      soc:
        bird_name: SOC
        name: School Ownership Code
        description: The School Ownership Code is a numeric code used to identify the type of school.
        data_format: text
        value_description: |-
          •      08 - Preschool
          •       09 – Special Education Schools (Public)
          •      11 – Youth Authority Facilities (CEA)
          •       13 – Opportunity Schools
          •       14 – Juvenile Court Schools
          •       15 – Other County or District Programs
          •       31 – State Special Schools
          •       60 – Elementary School (Public)
          •       61 – Elementary School in 1 School District (Public)
          •       62 – Intermediate/Middle Schools (Public)
          •       63 – Alternative Schools of Choice
          •       64 – Junior High Schools (Public)
          •       65 – K-12 Schools (Public)
          •       66 – High Schools (Public)
          •       67 – High Schools in 1 School District (Public)
          •       68 – Continuation High Schools
          •       69 – District Community Day Schools
          •       70 – Adult Education Centers
          •       98 – Regional Occupational Center/Program (ROC/P)
      soctype:
        bird_name: SOCType
        name: School Ownership Code Type
        description: The School Ownership Code Type is the text description of the type of school.
        data_format: text
        value_description: The School Ownership Code Type is the text description of the type of school.
      edopscode:
        bird_name: EdOpsCode
        name: Education Option Code
        description: The Education Option Code is a short text description of the type of education offered.
        data_format: text
        value_description: |-
          •      ALTSOC – Alternative School of Choice
          •      COMM – County Community School
          •       COMMDAY – Community Day School
          •       CON – Continuation School
          •       JUV – Juvenile Court School
          •       OPP – Opportunity School
          •       YTH – Youth Authority School
          •       SSS – State Special School
          •       SPEC – Special Education School
          •       TRAD – Traditional
          •       ROP – Regional Occupational Program
          •       HOMHOS – Home and Hospital
          •       SPECON – District Consortia Special Education School
      edopsname:
        bird_name: EdOpsName
        name: Educational Option Name
        description: Educational Option Name
        data_format: text
        value_description: The Educational Option Name is the long text description of the type of education
          being offered.
      eilcode:
        bird_name: EILCode
        name: Educational Instruction Level Code
        description: The Educational Instruction Level Code is a short text description of the institution's
          type relative to the grade range served.
        data_format: text
        value_description: |-
          •       A – Adult
          •       ELEM – Elementary
          •       ELEMHIGH – Elementary-High Combination
          •       HS – High School
          •       INTMIDJR – Intermediate/Middle/Junior High
          •       PS – Preschool
          •       UG – Ungraded
      eilname:
        bird_name: EILName
        name: Educational Instruction Level Name
        description: The Educational Instruction Level Name is the long text description of the institution’s
          type relative to the grade range served.
        data_format: text
        value_description: The Educational Instruction Level Name is the long text description of the
          institution’s type relative to the grade range served.
      gsoffered:
        bird_name: GSoffered
        name: grade span offered
        description: The grade span offered is the lowest grade and the highest grade offered or supported
          by the school, district, or administrative authority. This field might differ from the grade
          span served as reported in the most recent certified California Longitudinal Pupil Achievement
          (CALPADS) Fall 1 data collection.
        data_format: text
        value_description: |-
          For example XYZ School might display the following data:

          GSoffered = P–Adult

          GSserved = K–12
      gsserved:
        bird_name: GSserved
        name: grade span served.
        description: It is the lowest grade and the highest grade of student enrollment as reported in
          the most recent certified CALPADS Fall 1 data collection. Only K–12 enrollment is reported through
          CALPADS. This field may differ from the grade span offered.
        data_format: text
        value_description: |-
          commonsense evidence:

          1.     Only K–12 enrollment is reported through CALPADS

          2.     Note: Special programs at independent study, alternative education, and special education schools will often exceed the typical grade span for schools of that type
      virtual:
        bird_name: Virtual
        name: Virtual
        description: This field identifies the type of virtual instruction offered by the school. Virtual
          instruction is instruction in which students and teachers are separated by time and/or location,
          and interaction occurs via computers and/or telecommunications technologies.
        data_format: text
        value_description: |-
          The field is coded as follows:

          ·       F = Exclusively Virtual – The school has no physical building where students meet with each other or with teachers, all instruction is virtual.

          ·       V = Primarily Virtual – The school focuses on a systematic program of virtual instruction but includes some physical meetings among students or with teachers.

          ·       C = Primarily Classroom – The school offers virtual courses but virtual instruction is not the primary means of instruction.

          ·       N = Not Virtual – The school does not offer any virtual instruction.

          ·       P = Partial Virtual – The school offers some, but not all, instruction through virtual instruction. Note: This value was retired and replaced with the Primarily Virtual and Primarily Classroom values beginning with the 2016–17 school year.
      magnet:
        bird_name: Magnet
        name: Magnet
        description: This field identifies whether a school is a magnet school and/or provides a magnet
          program.
        data_format: integer
        value_description: |-
          The field is coded as follows:

          ·       1 = Magnet - The school is a magnet school and/or offers a magnet program.

          ·       0 = Not Magnet - The school is not a magnet school and/or does not offer a magnet program.

          commonsense evidence:

          Note: Preschools and adult education centers do not contain a magnet school indicator.
      latitude:
        bird_name: Latitude
        name: Latitude
        description: The angular distance (expressed in degrees) between the location of the school, district,
          or administrative authority and the equator measured north to south.
        data_format: real
        value_description: The angular distance (expressed in degrees) between the location of the school,
