# API spend: the ledger file, the caps and the prices the ledger charges (src/llm/ledger.py).
# A phase can spend up to its own cap, and all phases together up to the project cap. A phase
# missing from phase_caps_usd cannot make a single paid call: each phase's cap is set after
# its counted dry run, before its first paid call.
ledger: results/metrics/api_spend.json
project_cap_usd: 80.0
phase_caps_usd:
  phase0: 0.0 # scaffolding: no API calls
  phase1: 0.0 # data and data dictionary: no API calls
  phase2: 0.0 # safe execution layer: no API calls
  phase3: 0.0 # evaluation harness: no API calls
  # the agent and the design comparison: raised in steps, each from a counted dry run (pilot
  # first; then the comparison; then the chosen design's full runs), to at most $62. The cap is
  # the phase's total, earlier steps included.
  phase4: 33.0
  # confidence, calibration and escalation: raised in steps, each from a counted dry run (probes
  # on pilot questions first; then the critic and escalation runs; a router only if escalation
  # is adopted), to at most $15. The cap is the phase's total, earlier steps included.
  phase5: 12.0
  phase6: 0.0 # error analysis and what errors cost: no API calls
  # the statistical guardrail: raised in steps, each from a counted dry run (format probes first;
  # then the classifier, plan and answer runs, all direct), to at most $6.50. The cap is the
  # phase's total.
  phase7: 6.50
  # the product: tests use a scripted model; this covers one live smoke test of the finished
  # service, counted first with the token-counting endpoint.
  phase8: 0.50
  # release engineering: the canary's live runs (configs/canary.yaml), counted first
  # (results/metrics/phase9_dry_run.json: 23 calls, central $0.41, upper $0.87). The first run's
  # cap was $0.75 (it spent $0.35); raised to the phase's ceiling of $1.50 for a second run.
  phase9: 1.50
batch_discount: 0.5 # Message Batches: half of every token price

# USD per million tokens, Anthropic first-party list prices from
# https://platform.claude.com/docs/en/about-claude/pricing. Cache writes cost 1.25x the input
# price for the 5-minute lifetime and 2x for 1 hour; cache reads 0.1x, except 0.05x on
# Claude Opus 5.5.
prices_as_of: "2026-09-27"
prices_usd_per_mtok:
  claude-sonnet-5: { input: 2.00, output: 10.00, cache_write_5m: 2.50, cache_write_1h: 4.00, cache_read: 0.20 }
  claude-haiku-4-5: { input: 1.00, output: 5.00, cache_write_5m: 1.25, cache_write_1h: 2.00, cache_read: 0.10 }
  claude-opus-5-5: { input: 4.00, output: 20.00, cache_write_5m: 5.00, cache_write_1h: 8.00, cache_read: 0.20 }
